/* ==============================
   نظام الصور: يحاول أولًا الصورة المحلية من مجلد assets (إن وُجدت)،
   ثم يحاول رابط الموقع الرسمي، وإن فشل الاثنان يعرض بطاقة أنيقة
   بدل أيقونة الصورة المكسورة — لا يوجد src فارغ أبدًا.
   ملاحظة: لتفعيل الصور المحلية ضع الملفات في:
   public/products/<id>.png  (نفس الـ id الموجود في بيانات المنتج)
   public/news/<id>.png · public/recipes/<id>.png
   ============================== */
function useImageSource(id, folder, remoteSrc) {
  const [tier, setTier] = useState(0);
  // import.meta.env.BASE_URL = '/' في وضع التطوير و '/Okids-/' بعد البناء لنشره على GitHub Pages
  const base = "/Okids-/"; // يطابق اسم المستودع zarkiaaa-ai/Okids-
  const sources = useMemo(
    () => [`${base}${folder}/${id}.png`, remoteSrc].filter(Boolean),
    [id, folder, remoteSrc, base]
  );
  const failed = tier >= sources.length;
  return { src: failed ? null : sources[tier], failed, onError: () => setTier((t) => t + 1) };
}

function SmartImage({ id, folder = "products", remoteSrc, alt, className, boxClassName, onClick, iconSize = 24, compact = false }) {
  const { src, failed, onError } = useImageSource(id, folder, remoteSrc);
  if (failed) {
    return (
      <div className={"img-fallback " + (compact ? "img-fallback-compact " : "") + (boxClassName || "")} onClick={onClick} role={onClick ? "button" : undefined}>
        <ImageIcon size={iconSize} />
        {!compact && <span>صورة المنتج غير متوفرة حاليًا</span>}
      </div>
    );
  }
  return (
    <img
      src={src}
      alt={alt}
      className={className}
      loading="lazy"
      referrerPolicy="no-referrer"
      onClick={onClick}
      onError={onError}
    />
  );
}

function formatPrice(n) {
  const v = Number(n) || 0;
  return v.toLocaleString("ar-DZ") + " دج";
}
function readImageAsDataURL(file, callback) {
  if (!file || !file.type || !file.type.startsWith("image/")) return;
  const reader = new FileReader();
  reader.onload = () => callback(reader.result);
  reader.readAsDataURL(file);
}
function effectivePrice(p) {
  const base = Number(p.price) || 0;
  const disc = Number(p.discount) || 0;
  if (!base) return 0;
  if (!disc) return base;
  return Math.round(base * (1 - disc / 100));
}

function ProductCard({ p, onOpen, fav, onToggleFav, compareMode, selected, onSelect }) {
  const color = BRAND_COLOR[p.brand] || "#8C1D2B";
  const tint = BRAND_TINT[p.brand] || "#F3EEE2";
  const hasVariants = p.variants && p.variants.length > 0;
  return (
    <div className="product-card" style={{ borderColor: selected ? color : "transparent" }}>
      <div className="product-band" style={{ background: color }}>{p.brand}</div>
      {Number(p.discount) > 0 && <div className="hot-badge">خصم</div>}
      {hasVariants && <div className="variants-ribbon"><Sparkles size={11} /> {p.variants.length} أنواع</div>}
      <button className="fav-btn" onClick={() => onToggleFav(p.id)} aria-label="مفضلة">
        <Heart size={18} fill={fav ? "#E0455A" : "none"} color={fav ? "#E0455A" : "#8a8478"} />
      </button>
      <div className="product-img-wrap" style={{ background: `linear-gradient(160deg, ${tint}, var(--paper))` }} onClick={() => (compareMode ? onSelect(p.id) : onOpen(p.id))}>
        <SmartImage id={p.id} remoteSrc={p.img} alt={p.name} className="prod-img" boxClassName="prod-img-box" iconSize={22} />
      </div>
      <div className="product-body" onClick={() => (compareMode ? onSelect(p.id) : onOpen(p.id))}>
        <div className="product-type">{p.type}</div>
        <div className="product-name">{p.name}</div>
        <div className="product-desc">{p.desc}</div>
        {hasVariants && (
          <div className="mini-variant-row">
            {p.variants.map(v => <span key={v.id} className="mini-variant-dot">{v.label}</span>)}
          </div>
        )}
        {Number(p.price) > 0 && (
          <div className="product-price-row">
            {Number(p.discount) > 0 ? (
              <>
                <span className="price-old">{formatPrice(p.price)}</span>
                <span className="price-now">{formatPrice(effectivePrice(p))}</span>
                <span className="price-badge">-{p.discount}%</span>
              </>
            ) : (
              <span className="price-now">{formatPrice(p.price)}</span>
            )}
          </div>
        )}
      </div>
      {compareMode ? (
        <button className={"btn-outline small" + (selected ? " active" : "")} onClick={() => onSelect(p.id)} style={{ borderColor: color, color: selected ? "#fff" : color, background: selected ? color : "transparent" }}>
          {selected ? <><Check size={14}/> محدد</> : "اختيار للمقارنة"}
        </button>
      ) : (
        <button className="btn-outline small" style={{ borderColor: color, color }} onClick={() => onOpen(p.id)}>✨ التفاصيل</button>
      )}
    </div>
  );
}

      try { localStorage.setItem("okids:dark", next ? "1" : "0"); } catch (e) {}
      return next;
    });
  };
  const [prevScreen, setPrevScreen] = useState("home");
  const [moreSheet, setMoreSheet] = useState(false);
  const [activeProduct, setActiveProduct] = useState(null);
  const [activeBrandFilter, setActiveBrandFilter] = useState("الكل");
  const [query, setQuery] = useState("");
  const [sortBy, setSortBy] = useState("default");
  const [favs, setFavs] = useState([]);
  const [cart, setCart] = useState([]);
  const [compareIds, setCompareIds] = useState([]);
  const [adminAuthed, setAdminAuthed] = useState(false);
  const [adminPass, setAdminPass] = useState("");
  const [adminError, setAdminError] = useState("");
  const [toast, setToast] = useState("");
  const [recentlyViewed, setRecentlyViewed] = useState([]);

  useEffect(() => {
    (async () => {
      const d = await loadData();
      const f = await loadFavs();
      const c = await loadCart();
      const rv = await loadRecent();
      let normalized = null;
      if (d) {
        if (d.dataVersion !== DEFAULT_DATA.dataVersion) {
          // صدر تحديث لمحتوى المنتجات الحقيقي (مكونات/أوزان/إلخ) —
          // نستبدل كل المحتوى المعلوماتي بالنسخة الجديدة الصحيحة،
          // مع الحفاظ فقط على ما خصّصه صاحب المتجر يدويًا (الأسعار، الخصومات، التقييمات، الطلبات).
          const mergedProducts = DEFAULT_DATA.products.map(freshP => {
            const oldP = (d.products || []).find(x => x.id === freshP.id);
            return oldP
              ? { ...freshP, price: oldP.price ?? freshP.price, discount: oldP.discount ?? freshP.discount, reviews: oldP.reviews || [] }
              : freshP;
          });
          normalized = { ...DEFAULT_DATA, products: mergedProducts, orders: d.orders || [] };
          await saveData(normalized);
        } else {
          normalized = {
            ...d,
            orders: d.orders || [],
            products: (d.products || []).map(p => ({ price: 0, discount: 0, reviews: [], ...p })),
          };
        }
      }
      if (normalized) setData(normalized); else await saveData(DEFAULT_DATA);
      if (f) setFavs(f);
      if (c) setCart(c);
      if (rv) setRecentlyViewed(rv);
      setReady(true);
    })();
  }, []);

  const showToast = useCallback((msg) => {
    setToast(msg);
    setTimeout(() => setToast(""), 2200);
  }, []);

  const go = (s) => { setPrevScreen(screen); setScreen(s); setMoreSheet(false); window.scrollTo(0,0); };
  const openProduct = (id) => {
    setActiveProduct(id);
    go("productDetail");
    setRecentlyViewed(prev => {
      const next = [id, ...prev.filter(x => x !== id)].slice(0, 8);
      saveRecent(next);
      return next;
    });
  };

  const toggleFav = async (id) => {
    const next = favs.includes(id) ? favs.filter(x => x !== id) : [...favs, id];
    setFavs(next);
    await saveFavs(next);
  };

  const updateCart = async (mutator) => {
    setCart(prev => {
      const next = mutator([...prev]);
      saveCart(next);
      return next;
    });
  };
  const addToCart = (id, qty) => {
    updateCart(prev => {
      const existing = prev.find(x => x.id === id);
      if (existing) existing.qty += qty;
      else prev.push({ id, qty });
      return prev;
    });
    showToast("تمت الإضافة إلى السلة");
  };
  const setCartQty = (id, qty) => {
    updateCart(prev => {
      if (qty <= 0) return prev.filter(x => x.id !== id);
      const existing = prev.find(x => x.id === id);
      if (existing) existing.qty = qty;
      return prev;
    });
  };
  const removeFromCart = (id) => updateCart(prev => prev.filter(x => x.id !== id));
  const cartCount = cart.reduce((s, x) => s + x.qty, 0);

  const updateData = async (mutator) => {
    setData(prev => {
      const next = mutator(structuredClone(prev));
      saveData(next);
      return next;
    });
  };

  const submitOrder = async (customer) => {
    const items = cart.map(c => {
      const p = data.products.find(x => x.id === c.id);
      if (!p) return null;
      return { id: p.id, name: p.name, brand: p.brand, qty: c.qty, unitPrice: effectivePrice(p) };
    }).filter(Boolean);
    const total = items.reduce((s, it) => s + it.unitPrice * it.qty, 0);
    const order = {
      id: "ORD-" + Date.now().toString().slice(-8),
      date: new Date().toISOString(),
      customer,
      items,
      total,
      status: "جديد",
    };
    await updateData(d => { d.orders = [order, ...(d.orders || [])]; return d; });
    setCart([]);
    await saveCart([]);
    return order;
  };

  const filteredProducts = useMemo(() => {
    let list = data.products;
    if (activeBrandFilter !== "الكل") list = list.filter(p => p.brand === activeBrandFilter);
    if (query.trim()) {
      const q = query.trim().toLowerCase();
      list = list.filter(p =>
        p.name.toLowerCase().includes(q) || p.type.includes(q) || p.brand.toLowerCase().includes(q) ||
        p.desc.includes(q) || (q.includes("جبن") && true === true && (p.type.includes("جبن"))) ||
        (q.includes("حليب") && p.type.includes("حليب"))
      );
    }
    return list;
  }, [data.products, activeBrandFilter, query]);

  const sortedFilteredProducts = useMemo(() => {
    const list = [...filteredProducts];
    if (sortBy === "price_asc") list.sort((a, b) => effectivePrice(a) - effectivePrice(b));
    else if (sortBy === "price_desc") list.sort((a, b) => effectivePrice(b) - effectivePrice(a));
    else if (sortBy === "name_asc") list.sort((a, b) => a.name.localeCompare(b.name, "ar"));
    else if (sortBy === "discount") list.sort((a, b) => (Number(b.discount) || 0) - (Number(a.discount) || 0));
    return list;
  }, [filteredProducts, sortBy]);

  const product = useMemo(() => data.products.find(p => p.id === activeProduct), [data.products, activeProduct]);
  const compareProducts = compareIds.map(id => data.products.find(p => p.id === id)).filter(Boolean);

  const toggleCompareSelect = (id) => {
    setCompareIds(prev => {
      if (prev.includes(id)) return prev.filter(x => x !== id);
      if (prev.length >= 2) return [prev[1], id];
      return [...prev, id];
    });
  };

  if (!ready) {
    return (
      <div className="app-shell" dir="rtl"><Style />
        <div className="loading-screen premium">
          <div className="loading-glow" />
          <img src={LOGO} alt="OKID'S" referrerPolicy="no-referrer" className="loading-logo" style={{ width: 84 }} />
          <div className="loading-title">OKID'S</div>
          <div className="loading-sub">موسوعة الشركة ومنتجاتها</div>
          <div className="loading-bar"><div className="loading-bar-fill" /></div>
        </div>
      </div>
    );
  }

  return (
    <div className={"app-shell" + (darkMode ? " dark-mode" : "")} dir="rtl">
      <Style />
      <div className="app-frame">
        {screen === "home" && <HomeScreen data={data} go={go} openProduct={openProduct} recentlyViewed={recentlyViewed} setBrandFilter={setActiveBrandFilter} />}
        {screen === "about" && <AboutScreen data={data} go={go} />}
        {screen === "history" && <HistoryScreen data={data} go={go} />}
        {screen === "products" && (
          <ProductsScreen
            products={sortedFilteredProducts} allProducts={data.products} go={go} openProduct={openProduct}
            brandFilter={activeBrandFilter} setBrandFilter={setActiveBrandFilter}
            query={query} setQuery={setQuery} favs={favs} toggleFav={toggleFav}
            sortBy={sortBy} setSortBy={setSortBy}
          />
        )}
        {screen === "productDetail" && product && (
          <ProductDetailScreen product={product} allProducts={data.products} openProduct={openProduct} go={go} favs={favs} toggleFav={toggleFav} addToCart={addToCart} showToast={showToast} updateData={updateData} />
        )}
        {screen === "awards" && <AwardsScreen go={go} data={data} />}
        {screen === "news" && <NewsScreen data={data} go={go} />}
        {screen === "location" && <LocationScreen data={data} go={go} />}
        {screen === "employees" && <EmployeesScreen data={data} go={go} />}
        {screen === "branches" && <BranchesScreen data={data} go={go} />}
        {screen === "recipes" && <RecipesScreen data={data} go={go} />}
        {screen === "quality" && <QualityScreen data={data} go={go} />}
        {screen === "contact" && <ContactScreen data={data} go={go} />}
        {screen === "favorites" && (
          <FavoritesScreen products={data.products} favs={favs} go={go} openProduct={openProduct} toggleFav={toggleFav} addToCart={addToCart} showToast={showToast} />
        )}
        {screen === "compare" && (
          <CompareScreen products={data.products} compareIds={compareIds} toggleCompareSelect={toggleCompareSelect} compareProducts={compareProducts} go={go} />
        )}
        {screen === "sources" && <SourcesScreen data={data} go={go} />}
        {screen === "myorders" && <MyOrdersScreen data={data} go={go} />}
        {screen === "wholesale" && <WholesaleScreen products={data.products} go={go} />}
        {screen === "cart" && (
          <CartScreen
            cart={cart} products={data.products} go={go}
            setCartQty={setCartQty} removeFromCart={removeFromCart}
            submitOrder={submitOrder} showToast={showToast}
          />
        )}
        {screen === "admin" && (
          <AdminScreen
            go={go} data={data} updateData={updateData}
            authed={adminAuthed} setAuthed={setAdminAuthed}
            pass={adminPass} setPass={setAdminPass} error={adminError} setError={setAdminError}
            showToast={showToast}
          />
        )}
      </div>

      {toast && <div className="toast">{toast}</div>}

      {moreSheet && (
        <div className="sheet-backdrop" onClick={() => setMoreSheet(false)}>
          <div className="sheet" onClick={(e) => e.stopPropagation()}>
            <div className="sheet-handle" />
            <div className="sheet-hero">
              <span className="sheet-hero-icon"><Sparkles size={22} /></span>
              <div className="sheet-hero-title">موسوعة OKID'S</div>
              <div className="sheet-hero-sub">كل شيء عن الشركة والمنتجات في مكان واحد</div>
            </div>
            <button className="dark-mode-toggle-row" onClick={toggleDarkMode}>
              <span className="dark-mode-toggle-label">{darkMode ? "🌙" : "☀️"} الوضع الليلي</span>
              <span className={"dark-mode-switch" + (darkMode ? " on" : "")}><span className="dark-mode-switch-dot" /></span>
            </button>
            {MORE_GROUPS.map(group => (
              <div key={group.title} className="sheet-group">
                <div className="sheet-group-title"><group.icon size={14} color={group.color} /> {group.title}</div>
                <div className="sheet-grid">
                  {group.items.map(l => (
                    <button key={l.id} className="sheet-item" onClick={() => {
                      if (l.isAction && l.id === "shareapp") {
                        const shareData = { title: "OKID'S — موسوعة الشركة ومنتجاتها", text: "جرّب تطبيق OKID'S للتعرف على منتجات الشركة!", url: window.location.href };
                        if (navigator.share) navigator.share(shareData).catch(() => {});
                        else if (navigator.clipboard) { navigator.clipboard.writeText(window.location.href); showToast("تم نسخ رابط التطبيق 📋"); }
                        return;
                      }
                      go(l.id);
                    }}>
                      <span className="sheet-icon-badge" style={{ color: group.color }}>
                        <l.icon size={30} strokeWidth={1.8} />
                      </span>
                      <span>{l.label}</span>
                    </button>
                  ))}
                </div>
              </div>
            ))}
          </div>
        </div>
      )}

      {screen !== "productDetail" && (
        <a
          className="fab-whatsapp"
          href={`https://wa.me/?text=${encodeURIComponent("مرحبًا، أريد الاستفسار عن منتجات OKID'S 🧀")}`}
          target="_blank"
          rel="noreferrer"
          aria-label="تواصل عبر واتساب"
        >
          <WhatsAppIcon size={20} />
        </a>
      )}

      <nav className="bottom-nav">
        {(() => {
          const activeIdx = moreSheet ? NAV_MAIN.findIndex(item => item.id === "more") : NAV_MAIN.findIndex(item => item.id === screen);
          return activeIdx >= 0 && <div className="nav-active-pill" style={{ right: `${activeIdx * 20}%` }} />;
        })()}
        {NAV_MAIN.map(item => {
          const isActive = item.id === "more" ? moreSheet : screen === item.id;
          return (
            <button
              key={item.id}
              className={"nav-btn" + (isActive ? " active" : "")}
              onClick={() => (item.id === "more" ? setMoreSheet(true) : go(item.id))}
            >
              <span className="nav-icon-wrap">
                <item.icon size={20} />
                {item.id === "cart" && cartCount > 0 && <span className="nav-badge" key={cartCount}>{cartCount}</span>}
              </span>
              <span>{item.label}</span>
            </button>
          );
        })}
      </nav>
    </div>
  );
}

/* رسم توضيحي احترافي لفريق العمل (أشكال بشرية مبسّطة بمعاطف بيضاء) — بديل
   لائق ومحترم بدل نسب صور حقيقية لأشخاص غير موجودين فعليًا في الشركة. */
function TeamIllustration() {
  const Person = ({ x, tone }) => (
    <g transform={`translate(${x},0)`}>

function typeEmoji(type) {
  if (type.includes("حصص")) return "🧀";
  if (type.includes("أصابع") || type.includes("قضبان")) return "🥖";
  if (type.includes("بودرة")) return "🥛";

function FeaturedCarousel({ products, openProduct }) {
  const list = products;
  const [idx, setIdx] = useState(0);
  useEffect(() => {
    if (list.length <= 1) return;
    const t = setInterval(() => setIdx(i => (i + 1) % list.length), 3200);
    return () => clearInterval(t);
  }, [list.length]);
  if (list.length === 0) return null;
  const p = list[idx];
  const color = BRAND_COLOR[p.brand] || "#8C1D2B";
  return (
    <div className="big-showcase">
      <div className="big-showcase-box" style={{ background: `linear-gradient(150deg, ${BRAND_TINT[p.brand] || "#F3EEE2"}, var(--paper))` }} onClick={() => openProduct(p.id)}>

        {(p.variants && p.variants.length > 0) && <div className="big-showcase-variants">✨ {p.variants.length} أنواع</div>}
        {Number(p.discount) > 0 && <div className="big-showcase-discount">🔥 خصم {p.discount}%</div>}
        <div key={p.id} className="big-showcase-img-wrap">
          <SmartImage id={p.id} remoteSrc={p.img} alt={p.name} className="big-showcase-img" boxClassName="big-showcase-img-box" iconSize={38} />

        <div className="big-showcase-caption">
          <div className="big-showcase-name">{p.name}</div>
          <div className="big-showcase-type">{p.type}</div>
        </div>
      </div>
      <div className="featured-dots">
        {list.map((_, i) => (
          <span key={i} className={"featured-dot" + (i === idx ? " active" : "")} style={i === idx ? { background: color } : {}} onClick={() => setIdx(i)} />

function StarRow({ rating, size = 14, onRate }) {
  const stars = [1, 2, 3, 4, 5];
  return (
    <div className="star-row">
      {stars.map(s => (
        <span
          key={s}
          className={"star" + (onRate ? " interactive" : "")}
          onClick={onRate ? () => onRate(s) : undefined}
          style={{ fontSize: size }}
        >
          {s <= Math.round(rating) ? "★" : "☆"}
        </span>
      ))}
    </div>
  );
}
function avgRating(p) {
  const revs = p.reviews || [];
  if (!revs.length) return 0;
  return revs.reduce((s, r) => s + r.rating, 0) / revs.length;
}

const ORDER_STAGES = [
  { key: "جديد", label: "تم الاستلام", icon: Check },
  { key: "قيد المعالجة", label: "قيد المعالجة", icon: Clock },
  { key: "تم الشحن", label: "تم الشحن", icon: Package },
  { key: "تم التسليم", label: "تم التسليم", icon: ShieldCheck },
];
function OrderStepper({ status }) {
  if (status === "ملغى") {
    return <div className="order-cancelled"><X size={14} /> هذا الطلب مُلغى</div>;
  }
  const idx = Math.max(0, ORDER_STAGES.findIndex(s => s.key === status));
  return (
    <div className="order-stepper">
      {ORDER_STAGES.map((s, i) => (
        <div key={s.key} className={"order-step" + (i <= idx ? " done" : "")}>
          <div className="order-step-dot">{i <= idx ? <Check size={13} /> : <s.icon size={13} />}</div>
          <div className="order-step-label">{s.label}</div>
          {i < ORDER_STAGES.length - 1 && <div className={"order-step-line" + (i < idx ? " done" : "")} />}
        </div>
      ))}
    </div>
  );
}

function CartScreen({ cart, products, go, setCartQty, removeFromCart, submitOrder, showToast }) {
  const [confirmedOrder, setConfirmedOrder] = useState(null);
  const [form, setForm] = useState({ name: "", phone: "", wilaya: "", address: "", delivery: "توصيل للمنزل", note: "" });
  const [formError, setFormError] = useState("");

  const items = cart.map(c => {
    const p = products.find(x => x.id === c.id);
    if (!p) return null;
    return { ...c, product: p, unitPrice: effectivePrice(p) };
  }).filter(Boolean);
  const total = items.reduce((s, it) => s + it.unitPrice * it.qty, 0);

  const handleSubmit = async (e) => {
    e.preventDefault();
    if (!form.name.trim() || !form.phone.trim() || !form.wilaya) {
      setFormError("الاسم ورقم الهاتف والولاية مطلوبة لإتمام الطلب.");
      return;
    }
    setFormError("");
    const order = await submitOrder(form);
    setConfirmedOrder(order);
  };

  if (confirmedOrder) {
    const shareText = `تأكيد طلب OKID'S #${confirmedOrder.id}\n${confirmedOrder.items.map(it => `• ${it.name} × ${it.qty} — ${formatPrice(it.unitPrice * it.qty)}`).join("\n")}\n\nالإجمالي: ${formatPrice(confirmedOrder.total)}\nالاسم: ${confirmedOrder.customer.name}\nالهاتف: ${confirmedOrder.customer.phone}${confirmedOrder.customer.wilaya ? "\nالولاية: " + confirmedOrder.customer.wilaya : ""}`;
    return (
      <div className="screen">
        <TopBar title="تم استلام الطلب" onBack={() => go("home")} />
        <div className="content-pad">
          <div className="card soft center">
            <Check size={30} color="#2E8B57" />
            <h3 style={{ margin: "10px 0 4px" }}>شكرًا لك، {confirmedOrder.customer.name}!</h3>
            <p className="hint no-margin">تم استلام طلبك رقم <b>{confirmedOrder.id}</b> بإجمالي {formatPrice(confirmedOrder.total)}. سنتواصل معك على {confirmedOrder.customer.phone} قريبًا لتأكيد التوصيل.</p>
          </div>
          <div className="card soft" style={{ marginTop: 12 }}>
            <div className="award-cat-title"><Package size={16} /> حالة الطلب</div>
            <OrderStepper status={confirmedOrder.status} />
          </div>
          <div className="card soft" style={{ marginTop: 12 }}>
            <div className="award-cat-title"><ShoppingCart size={16} /> تفاصيل الطلب</div>
            {confirmedOrder.items.map(it => (
              <div key={it.id} className="order-item-row">
                <span>{it.name} × {it.qty}</span>
                <span>{formatPrice(it.unitPrice * it.qty)}</span>
              </div>
            ))}
            <div className="order-item-row order-item-total">
              <span>الإجمالي</span>
              <span>{formatPrice(confirmedOrder.total)}</span>
            </div>
          </div>
          <a
            className="btn-outline full"
            style={{ marginTop: 12, display: "flex", alignItems: "center", justifyContent: "center", gap: 6 }}
            href={`https://wa.me/?text=${encodeURIComponent(shareText)}`}
            target="_blank"
            rel="noreferrer"
          >
            <WhatsAppIcon size={15} color="var(--primary)" /> شارك تفاصيل الطلب عبر واتساب
          </a>
          <button className="btn-primary full" style={{ marginTop: 10 }} onClick={() => go("home")}>العودة إلى الرئيسية</button>
        </div>
      </div>
    );
  }

  if (items.length === 0) {
    return (
      <div className="screen">
        <TopBar title="السلة" onBack={() => go("home")} />
        <div className="content-pad">
          <EmptyState text="سلتك فارغة. أضف منتجًا من صفحة المنتجات لتبدأ طلبك." />
          <button className="btn-primary full" onClick={() => go("products")}>تصفّح المنتجات</button>
        </div>
      </div>
    );
  }

  return (
    <div className="screen">
      <TopBar title="السلة" onBack={() => go("products")} />
      <div className="content-pad">
        <div className="cart-list">
          {items.map(it => (
            <div key={it.id} className="cart-row">
              <SmartImage id={it.product.id} remoteSrc={it.product.img} alt={it.product.name} className="cart-img" boxClassName="cart-img-box" iconSize={16} />
              <div className="cart-row-body">
                <div className="cart-row-name">{it.product.name}</div>
                <div className="cart-row-unit">{formatPrice(it.unitPrice)} / وحدة</div>
                <div className="qty-stepper small">
                  <button onClick={() => setCartQty(it.id, it.qty - 1)} aria-label="إنقاص"><Minus size={12}/></button>
                  <span>{it.qty}</span>
                  <button onClick={() => setCartQty(it.id, it.qty + 1)} aria-label="زيادة"><Plus size={12}/></button>
                </div>
              </div>
              <div className="cart-row-right">
                <div className="cart-row-total">{formatPrice(it.unitPrice * it.qty)}</div>
                <button className="icon-btn danger" onClick={() => removeFromCart(it.id)} aria-label="حذف"><Trash2 size={15}/></button>

            </div>
          ))}

        <div className="cart-total-row">
          <span>الإجمالي</span>
          <span className="cart-total-value">{formatPrice(total)}</span>

        <div className="card soft" style={{ marginTop: 16 }}>
          <div className="award-cat-title"><ShoppingCart size={16}/> بيانات التوصيل</div>

  if (!authed) {

              <input

            </div>
            {error && <div className="error-text">{error}</div>}
            <p className="hint tiny no-margin">كلمة المرور التجريبية: okids2026 — تنبيه: هذا نموذج أولي بلا نظام دخول أو تشفير حقيقي؛ الربط بقاعدة بيانات وحسابات مدير فعلية يتطلب خادمًا خلفيًا حقيقيًا.</p>

  const c = data.company;

  const saveCompanyField = (field, value) => updateData(d => { d.company[field] = value; return d; });

    const p = newProduct;
    if (!p?.name || !p?.brand) return;
    updateData(d => { d.products.push({ ...p, price: Number(p.price) || 0, discount: Number(p.discount) || 0, id: p.name.toLowerCase().replace(/\s+/g, "-") + "-" + Date.now() }); return d; });

                                        showToast(`تم رفع صورة ${v.label}`);
                                      });
                                    }}
                                  />
                                </label>
                              </div>
                            ))}
                            {p.variants.map((v, vi) => (
                              v.sizeVariants && v.sizeVariants.length > 0 && (
                                <div key={v.id + "-sizes"} className="admin-nested-sizes">
                                  <div className="hint tiny no-margin" style={{ marginBottom: 6 }}>📏 أحجام «{v.label}»</div>
                                  {v.sizeVariants.map((s, si) => (
                                    <div key={s.id} className="admin-variant-upload-row">
                                      <span className="admin-variant-label">{s.label}</span>
                                      <label className="admin-thumb-upload-wrap small" title="اضغط لرفع صورة">
                                        {s.img ? (
                                          <SmartImage id={`${p.id}-${v.id}-${s.id}-admin`} remoteSrc={s.img} alt={s.label} className="admin-thumb" boxClassName="admin-thumb-box" iconSize={12} compact />
                                        ) : (
                                          <span className="admin-thumb admin-thumb-empty"><ImageIcon size={14}/></span>
                                        )}
                                        <span className="admin-thumb-upload-badge"><ImageIcon size={9}/></span>
                                        <input
                                          type="file"
                                          accept="image/*"
                                          style={{ display: "none" }}
                                          onChange={(e) => {
                                            const file = e.target.files && e.target.files[0];
                                            if (!file) return;
                                            readImageAsDataURL(file, (dataUrl) => {
                                              updateData(d => {
                                                const prod = d.products.find(x => x.id === p.id);
                                                if (prod && prod.variants && prod.variants[vi] && prod.variants[vi].sizeVariants) {
                                                  prod.variants[vi].sizeVariants[si].img = dataUrl;
                                                }
                                                return d;
                                              });
                                              showToast(`تم رفع صورة ${v.label} — ${s.label}`);
                                            });
                                          }}
                                        />
                                      </label>
                                    </div>
                                  ))}
                                </div>
                              )
                            ))}
                          </div>
                        </div>
                      )}

                      <div className="admin-section">
                        <div className="admin-section-title"><span className="admin-section-num">{p.variants && p.variants.length > 0 ? "4" : "3"}</span> التفاصيل الغذائية</div>
                        <div className="admin-field"><label>🧾 المكونات</label><textarea className="admin-input" rows={2} value={p.ingredients} onChange={(e) => saveEditProduct(p.id, "ingredients", e.target.value)} /></div>
                        <div className="admin-field"><label>⚖️ الوزن / الأحجام</label><input className="admin-input" value={p.sizes} onChange={(e) => saveEditProduct(p.id, "sizes", e.target.value)} /></div>
                        <div className="admin-field-row">
                          <div className="admin-field"><label>❄️ طريقة الحفظ</label><input className="admin-input" value={p.storage} onChange={(e) => saveEditProduct(p.id, "storage", e.target.value)} /></div>
                          <div className="admin-field"><label>⏳ الصلاحية</label><input className="admin-input" value={p.expiry} onChange={(e) => saveEditProduct(p.id, "expiry", e.target.value)} /></div>
                        </div>
                      </div>
                    </div>
                  )}

                  <div className="admin-price-row">
                    <div className="admin-price-field">
                      <label>السعر (دج)</label>
                      <input className="admin-input" type="number" value={p.price || 0} onChange={(e) => saveEditProduct(p.id, "price", Number(e.target.value))} />
                    </div>
                    <div className="admin-price-field">
                      <label>خصم %</label>
                      <input className="admin-input" type="number" value={p.discount || 0} onChange={(e) => saveEditProduct(p.id, "discount", Number(e.target.value))} />
                    </div>
                    <div className="admin-price-final">
                      {Number(p.price) > 0 ? formatPrice(effectivePrice(p)) : "بدون سعر"}
                    </div>
                  </div>
                </div>
              ))}
            </div>
          </>
        )}

        {tab === "orders" && (
          <div className="admin-list">
            {(!data.orders || data.orders.length === 0) && (
              <EmptyState text="لا توجد طلبات بعد. عندما يؤكد أحد الزوار طلبًا من السلة سيظهر هنا." />
            )}
            {(data.orders || []).map(o => (
              <div key={o.id} className="card soft order-card">
                <div className="order-head">
                  <div>
                    <div className="admin-row-title">{o.id}</div>
                    <div className="hint tiny no-margin">{new Date(o.date).toLocaleString("ar-DZ")}</div>
                  </div>
                  <select
                    className="order-status-select"
                    value={o.status}
                    onChange={(e) => updateData(d => { const ord = d.orders.find(x => x.id === o.id); if (ord) ord.status = e.target.value; return d; })}
                  >
                    {["جديد","قيد المعالجة","تم الشحن","تم التسليم","ملغى"].map(s => <option key={s} value={s}>{s}</option>)}
                  </select>
                </div>
                <OrderStepper status={o.status} />
                <div className="order-customer">
                  <div><Users size={13}/> {o.customer.name}</div>
                  <div><Phone size={13}/> {o.customer.phone}</div>
                  {o.customer.address && <div><MapPin size={13}/> {o.customer.address}</div>}
                  {o.customer.note && <div className="hint tiny no-margin">ملاحظة: {o.customer.note}</div>}
                </div>
                <div className="order-items">
                  {o.items.map((it, i) => (
                    <div key={i} className="order-item-row">
                      <span>{it.name} × {it.qty}</span>
                      <span>{formatPrice(it.unitPrice * it.qty)}</span>
                    </div>
                  ))}
                </div>
                <div className="order-total-row">
                  <span>الإجمالي</span>
                  <span>{formatPrice(o.total)}</span>
                </div>
                <button className="icon-btn danger" style={{ marginTop: 8 }} onClick={() => updateData(d => { d.orders = d.orders.filter(x => x.id !== o.id); return d; })}>
                  <Trash2 size={14}/> حذف الطلب
                </button>
              </div>
            ))}
          </div>
        )}

        {tab === "news" && (
          <>
            <div className="card soft">
              <input className="admin-input" placeholder="عنوان الخبر" value={newNews.title} onChange={(e) => setNewNews({ ...newNews, title: e.target.value })} />
              <input className="admin-input" placeholder="التاريخ (YYYY-MM-DD)" value={newNews.date} onChange={(e) => setNewNews({ ...newNews, date: e.target.value })} />
              <input className="admin-input" placeholder="المكان" value={newNews.place} onChange={(e) => setNewNews({ ...newNews, place: e.target.value })} />
              <input className="admin-input" placeholder="وصف مختصر" value={newNews.desc} onChange={(e) => setNewNews({ ...newNews, desc: e.target.value })} />
              <button className="btn-primary full" onClick={addNews}><Plus size={16}/> إضافة خبر</button>
            </div>
            <div className="admin-list">
              {data.news.map(n => (
                <div key={n.id} className="admin-row">
                  <div className="admin-row-body">
                    <div className="admin-row-title">{n.title}</div>
                    <div className="hint tiny no-margin">{n.date} · {n.place}</div>
                  </div>
                  <button className="icon-btn danger" onClick={() => deleteNews(n.id)}><Trash2 size={16}/></button>
                </div>
              ))}
            </div>
          </>
        )}
      </div>
      <ConfirmDialog
        open={!!confirmState}
        title={confirmState?.title}
        message={confirmState?.message}
        danger={confirmState?.danger}
        confirmLabel={confirmState?.confirmLabel}
        onConfirm={confirmState?.onConfirm}
        onCancel={closeConfirm}
      />
    </div>
  );
}

function AdminField({ label, value, onSave, textarea }) {
  const [v, setV] = useState(value);
  useEffect(() => setV(value), [value]);
  return (
    <div className="admin-field">
      <label>{label}</label>
      {textarea ? (
        <textarea className="admin-input" rows={4} value={v} onChange={(e) => setV(e.target.value)} onBlur={() => onSave(v)} />
      ) : (
        <input className="admin-input" value={v} onChange={(e) => setV(e.target.value)} onBlur={() => onSave(v)} />
      )}
    </div>
  );
}

  return (
    <div className="info-row">

        <div className="info-row-label">{label}</div>
        <div className="info-row-value">{value}</div>
      </div>

}

  return (

      <Icon size={16} color="#1C4E9C" />

        <div className="fact-value">{value}</div>
      </div>

}

function ConfirmDialog({ open, title, message, confirmLabel = "نعم، تأكيد", danger, onConfirm, onCancel }) {
  if (!open) return null;
  return (
    <div className="confirm-overlay" onClick={onCancel}>
      <div className="confirm-box" onClick={(e) => e.stopPropagation()}>
        <div className="confirm-icon" style={{ background: danger ? "#fbe9e9" : "#e9f0f8", color: danger ? "#c0392b" : "#1D4E89" }}>
          {danger ? <Trash2 size={20} /> : <Info size={20} />}
        </div>
        <h3 className="confirm-title">{title}</h3>
        {message && <p className="confirm-message">{message}</p>}
        <div className="confirm-actions">
          <button className="btn-outline full" onClick={onCancel}>إلغاء</button>
          <button className={"btn-primary full" + (danger ? " confirm-danger-btn" : "")} onClick={onConfirm}>{confirmLabel}</button>
        </div>
      </div>
    </div>
  );
}

function EmptyState({ text }) {
  return <div className="empty-state"><Search size={26} color="#c9c0ae" /><p>{text}</p></div>;
}

/* ============================== Styles ============================== */
function Style() {
  return (
    <style>{`
      @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&family=Amiri:ital,wght@0,400;0,700;1,400;1,700&display=swap');

      :root{
        --ink:#1B2430; --cream:#F5F6F8; --paper:#FFFFFF; --gold:#A6863D;
        --primary:#0F2D52; --bravo:#1D4E89; --tasty:#D69A22; --line:#E4E7EC;
        --muted:#6B7280;
        --font-ui:'Cairo','Segoe UI',Tahoma,Geneva,Arial,sans-serif;
        --font-serif:'Amiri','Georgia','Times New Roman',serif;
        /* ===== Design tokens — spacing / radius / shadow / type scale ===== */
        --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-5:20px; --sp-6:28px;
        --r-sm:10px; --r-md:14px; --r-lg:18px; --r-xl:22px;
        --shadow-sm:0 2px 8px rgba(15,45,82,0.06);
        --shadow-md:0 6px 18px rgba(15,45,82,0.10);

        --fs-h1:26px; --fs-h2:21px; --fs-h3:17px; --fs-h4:14.5px; --fs-body:13px; --fs-small:11.5px;

      }
      .app-shell.dark-mode{

        --primary:#3E6FA8; --bravo:#4A7FD4; --tasty:#E0B15A; --line:#26333F;
        --muted:#93A1B0;
        --shadow-sm:0 2px 8px rgba(0,0,0,0.25); --shadow-md:0 6px 18px rgba(0,0,0,0.32); --shadow-lg:0 12px 32px rgba(0,0,0,0.4);
      }
      .app-shell.dark-mode .hero{ background: linear-gradient(180deg,#0A121C 0%, #16202E 100%); }

      *{box-sizing:border-box;}

        *, *::before, *::after{ animation-duration:0.01ms !important; animation-iteration-count:1 !important; transition-duration:0.01ms !important; scroll-behavior:auto !important; }
      }
      /* تمت إزالة content-visibility:auto من هنا لأنها كانت السبب الحقيقي
         في اختفاء البطاقات عشوائيًا أثناء التمرير: عند خروج البطاقة من الشاشة
         كان المتصفح (خصوصًا على Android WebView) "يتجاهل" رسمها لتحسين الأداء،
         وعند عودتها للظهور كانت أحيانًا تُحسب كأنها لم تُرسم بعد بسبب تعارضها
         مع حركة CSS (animation: fadeInUp ... both) المطبّقة على نفس البطاقة،
         فتبقى مخفية (opacity:0) حتى يحدث إعادة رسم إجباري (مثل لمس الشاشة). */
      html{ scroll-behavior:smooth; }
      body, .app-shell, .app-frame, .content-pad, .h-scroll, .chip-row, .admin-tab-row, .sheet{ -webkit-overflow-scrolling:touch; }
      .app-shell{ overscroll-behavior-y:contain; }
      .sheet{ overscroll-behavior:contain; }
      button, a, .product-card, .chip, .icon-btn, .nav-btn, .sheet-item{ touch-action:manipulation; -webkit-tap-highlight-color:transparent; }
      .h-scroll, .chip-row, .admin-tab-row{ scroll-snap-type:x proximity; }
      .mini-card, .related-card{ scroll-snap-align:start; }
      .app-shell{
        font-family:var(--font-ui); background:var(--cream); color:var(--ink);
        min-height:100vh; display:flex; justify-content:center;
      }
      .app-frame{ width:100%; max-width:480px; min-height:100vh; background:var(--cream); position:relative; padding-bottom:78px; }

      /* ============================== حركات وانتقالات احترافية ============================== */
      @keyframes fadeInUp{ from{ opacity:0; transform:translateY(14px); } to{ opacity:1; transform:translateY(0); } }
      @keyframes fadeIn{ from{ opacity:0; } to{ opacity:1; } }
      @keyframes popIn{ 0%{ transform:scale(0.4); opacity:0; } 60%{ transform:scale(1.15); } 100%{ transform:scale(1); opacity:1; } }
      @keyframes floatY{ 0%,100%{ transform:translateY(0); } 50%{ transform:translateY(-6px); } }
      @keyframes shimmerGrad{ 0%{ background-position:0% 50%; } 50%{ background-position:100% 50%; } 100%{ background-position:0% 50%; } }
      @keyframes pulseRing{ 0%{ box-shadow:0 0 0 0 rgba(28,78,156,0.35); } 100%{ box-shadow:0 0 0 10px rgba(28,78,156,0); } }

      .screen{ animation: pageIn 0.28s var(--ease) both; }
      @keyframes pageIn{ from{ opacity:0; transform:translateY(6px);} to{ opacity:1; transform:translateY(0);} }
      .app-frame > .screen, .app-frame > div.screen{ animation: fadeIn 0.32s ease; }

      button, a{ transition: transform .15s ease, opacity .15s ease, background-color .2s ease, box-shadow .2s ease; }
      .btn-primary:active, .btn-outline:active, .btn-ghost:active, .chip:active, .icon-btn:active, .nav-btn:active, .mini-card:active, .sheet-item:active{ transform:scale(0.95); }
      .btn-primary:not(:disabled):hover{ box-shadow:0 6px 18px rgba(28,78,156,0.28); }

      /* أزلنا هنا حركة الدخول (animation: fadeInUp ... both) التي كانت مطبّقة
         على كل بطاقة منتج. السبب: البطاقات فيها opacity animation + box-shadow +
         border-radius، وعند تكرارها بعشرات النسخ داخل قائمة قابلة للتمرير،
         يجبر هذا المتصفح (خصوصًا على هواتف Android متوسطة الفئة) على ترقية كل
         بطاقة إلى طبقة GPU منفصلة (compositor layer)، وتحت ضغط الذاكرة يفشل
         المتصفح أحيانًا في إعادة رسم بعض هذه الطبقات عند عودتها للشاشة أثناء
         التمرير، فتظهر البطاقة فارغة/مختفية بشكل عشوائي — وهذا يطابق تمامًا
         المشكلة الموصوفة (لا تخص بطاقة معينة، تحدث لأي بطاقة). */
      .product-card{ transition: transform .2s ease, box-shadow .2s ease; }
      .product-card:active{ transform:scale(0.97); box-shadow:0 2px 6px rgba(36,28,21,0.08); }

      .product-card:active .prod-img, .product-img-wrap:active .prod-img,
      .product-img-wrap:hover .prod-img{ transform:scale(1.1) !important; animation-play-state:paused; }
      .mini-card{ transition: transform .2s ease; }
      .mini-card:active .mini-img, .mini-card:hover .mini-img{ transform:scale(1.1) !important; animation-play-state:paused; }

      .hero{ background-size:180% 180%; animation: shimmerGrad 10s ease-in-out infinite; }
      .hero-logo{ animation: floatY 3.6s ease-in-out infinite; }
      .hero-badge{ animation: popIn 0.5s ease both; animation-delay:0.1s; }
      .hero h1{ animation: fadeInUp 0.55s ease both; animation-delay:0.15s; }
      .hero p{ animation: fadeInUp 0.55s ease both; animation-delay:0.22s; }
      .hero-actions{ animation: fadeInUp 0.55s ease both; animation-delay:0.28s; }
      .hero-links{ animation: fadeInUp 0.55s ease both; animation-delay:0.34s; }

      .nav-badge{ animation: popIn 0.35s cubic-bezier(.34,1.56,.64,1); }
      .fav-btn{ transition: transform .25s cubic-bezier(.34,1.56,.64,1); }

      .pd-hero:active .pd-hero-img, .pd-hero:hover .pd-hero-img{ transform:scale(1.08) !important; }

      .stat{ transition: transform .2s ease; }
