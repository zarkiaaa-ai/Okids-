      .stats-strip .stat:nth-child(2){ animation-delay:0.10s; }
      .stats-strip .stat:nth-child(3){ animation-delay:0.15s; }
      .stats-strip .stat:nth-child(4){ animation-delay:0.20s; }
      .stat:active{ transform:scale(0.96); }

      .toast{ animation: popIn 0.3s cubic-bezier(.34,1.56,.64,1); }
      .lightbox-img{ animation: popIn 0.35s ease; }
      .qty-stepper button:active{ transform:scale(0.85); }
      h1,h2,h3{ font-family:var(--font-ui); margin:0; }
      button{ font-family:inherit; cursor:pointer; }
      input, textarea{ font-family:inherit; }
      a{ color:inherit; text-decoration:none; }

      .loading-screen{ height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:18px; }
      .loading-screen.premium{ background: linear-gradient(160deg,#0F2D52 0%, #0A1E38 100%); position:relative; overflow:hidden; gap:10px; }
      .loading-glow{ position:absolute; width:280px; height:280px; border-radius:50%; background:radial-gradient(circle, rgba(232,162,59,0.25), transparent 70%); animation: loadingPulse 2.4s ease-in-out infinite; }
      @keyframes loadingPulse{ 0%,100%{ transform:scale(1); opacity:0.7;} 50%{ transform:scale(1.15); opacity:1;} }
      .loading-logo{ opacity:0.95; filter:brightness(0) invert(1); position:relative; z-index:1; animation: popIn 0.6s cubic-bezier(.34,1.56,.64,1) both; }
      .loading-title{ font-family:var(--font-ui); font-size:26px; color:#fff; position:relative; z-index:1;
        background: linear-gradient(90deg, #E8A23B 0%, #fff 50%, #E8A23B 100%); background-size:200% auto; -webkit-background-clip:text; background-clip:text; color:transparent; animation: shimmerText 3s linear infinite; }
      .loading-sub{ font-size:12px; color:rgba(255,255,255,0.6); position:relative; z-index:1; }
      .loading-bar{ width:120px; height:3px; background:rgba(255,255,255,0.15); border-radius:4px; overflow:hidden; margin-top:14px; position:relative; z-index:1; }
      .loading-bar-fill{ width:40%; height:100%; background:linear-gradient(90deg,var(--gold),#fff); border-radius:4px; animation: loadingBarSlide 1.3s ease-in-out infinite; }
      @keyframes loadingBarSlide{ 0%{ transform:translateX(-100%);} 100%{ transform:translateX(350%);} }
      .spinner{ width:28px; height:28px; border-radius:50%; border:3px solid var(--line); border-top-color:var(--primary); animation:spin 0.8s linear infinite; }
      @keyframes spin{ to{ transform:rotate(360deg);} }

      /* Hero */
      .hero{ background: linear-gradient(180deg,#0F2D52 0%, #0A1E38 100%); color:#fff; padding:28px 20px 34px; text-align:center; border-radius:0 0 28px 28px; position:relative; overflow:hidden; }
      .hero::after{ content:""; position:absolute; inset:0; background: radial-gradient(circle at 85% -10%, rgba(166,134,61,0.3), transparent 55%); pointer-events:none; }
      .hero-particle{ display:none; }
      .hero-glow{ position:absolute; top:-40%; right:-20%; width:280px; height:280px; border-radius:50%; background:radial-gradient(circle, rgba(166,134,61,0.28) 0%, rgba(166,134,61,0) 70%); pointer-events:none; z-index:0; animation: heroGlowPulse 6s ease-in-out infinite; }
      @keyframes heroGlowPulse{ 0%,100%{ opacity:0.7; transform:scale(1);} 50%{ opacity:1; transform:scale(1.15);} }
      .hero-logo{ width:64px; margin-bottom:10px; filter:brightness(0) invert(1); opacity:0.92; position:relative; z-index:1; }
      .hero-badge{ display:inline-flex; align-items:center; gap:6px; background:rgba(166,134,61,0.16); border:1px solid rgba(166,134,61,0.4); color:#E8CE8F; padding:5px 12px; border-radius:20px; font-size:12px; margin-bottom:12px; position:relative; z-index:1; }
      .hero h1{ font-size:30px; line-height:1.4; margin-bottom:12px; font-family:var(--font-ui); font-weight:800; letter-spacing:0.2px; position:relative; z-index:1; }
      .hero-shimmer-text{ background: linear-gradient(90deg, #E8A23B 0%, #fff 50%, #E8A23B 100%); background-size:200% auto; -webkit-background-clip:text; background-clip:text; color:transparent; animation: shimmerText 3.5s linear infinite; }
      @keyframes shimmerText{ to{ background-position: -200% center; } }
      .hero p{ font-size:13.5px; opacity:0.82; line-height:1.7; max-width:340px; margin:0 auto 20px; position:relative; z-index:1; }
      .hero-actions{ display:flex; flex-direction:column; gap:10px; align-items:stretch; margin:0 auto 14px; max-width:300px; position:relative; z-index:1; }
      .hero-btn-main{ background:linear-gradient(135deg, var(--gold), #8a6d2f); color:#fff; border:none; padding:15px 20px; border-radius:18px; font-weight:800; font-size:15px; display:flex; align-items:center; justify-content:center; gap:8px; box-shadow:0 8px 20px rgba(166,134,61,0.35); transition: transform .15s ease; }
      .hero-btn-main:active{ transform:scale(0.96); }
      .hero-btn-secondary{ background:rgba(255,255,255,0.08); color:#fff; border:1.5px solid rgba(255,255,255,0.3); padding:13px 20px; border-radius:18px; font-weight:700; font-size:14px; display:flex; align-items:center; justify-content:center; gap:8px; transition: transform .15s ease, background .15s ease; }
      .hero-btn-secondary:active{ transform:scale(0.96); background:rgba(255,255,255,0.15); }
      .hero-links{ display:flex; gap:8px; justify-content:center; flex-wrap:wrap; position:relative; z-index:1; }
      .hero-links button{ display:flex; align-items:center; gap:5px; background:transparent; border:1px solid rgba(255,255,255,0.2); color:rgba(255,255,255,0.85); font-size:11.5px; padding:6px 13px; border-radius:16px; transition: background .15s ease, transform .15s ease; }
      .hero-links button:active{ transform:scale(0.94); background:rgba(255,255,255,0.1); }

      .btn-primary{ background:var(--primary); color:#fff; border:none; padding:var(--sp-3) var(--sp-5); border-radius:var(--r-lg); font-weight:800; font-size:var(--fs-body); display:inline-flex; align-items:center; gap:6px; justify-content:center; letter-spacing:0.2px; box-shadow:var(--shadow-md); transition: transform .15s var(--ease), box-shadow .15s var(--ease); }
      .btn-primary:active{ transform:scale(0.96); box-shadow:0 3px 8px rgba(15,45,82,0.2); }
      .btn-primary.full{ width:100%; margin-top:14px; }
      .btn-ghost{ background:rgba(255,255,255,0.08); color:#fff; border:1px solid rgba(255,255,255,0.3); padding:13px 22px; border-radius:16px; font-weight:800; font-size:14px; }
      .btn-outline{ background:transparent; border:1.5px solid var(--primary); color:var(--primary); border-radius:var(--r-lg); font-weight:700; font-size:var(--fs-body); padding:var(--sp-3) var(--sp-5); transition: transform .15s var(--ease); }
      .btn-outline:active{ transform:scale(0.96); }
      .btn-outline.small{ padding:7px 10px; font-size:12.5px; width:100%; margin-top:8px; display:flex; align-items:center; justify-content:center; gap:4px; }
      .btn-outline.full{ padding:12px 20px; font-size:14px; width:100%; display:flex; align-items:center; justify-content:center; gap:6px; }

      .stats-strip{ display:grid; grid-template-columns:repeat(2,1fr); gap:10px; padding:16px 20px 4px; }
      .stat{ background:var(--paper); border:1px solid var(--line); border-radius:14px; padding:12px; text-align:center; transition: transform .2s ease, box-shadow .2s ease; }
      .stat:active{ transform:scale(0.96); box-shadow:0 2px 8px rgba(0,0,0,0.08); }
      .stat-emoji{ display:flex; justify-content:center; margin-bottom:4px; color:var(--primary); }
      .stat-num{ display:block; font-family:var(--font-ui); font-weight:700; color:var(--primary); font-size:16px; }
      .stat-label{ font-size:11px; color:var(--muted); }

      .section-title{ padding:22px 20px 10px; }
      .eyebrow{ display:flex; align-items:center; gap:6px; font-size:11px; letter-spacing:1.5px; color:var(--gold); font-weight:700; text-transform:uppercase; margin-bottom:4px; }
      .dot{ width:6px; height:6px; border-radius:50%; background:var(--gold); }
      .section-title h2{ font-size:var(--fs-h2); letter-spacing:0.2px; font-family:var(--font-ui); font-weight:700; }
      .section-title .sub{ font-size:var(--fs-small); color:var(--muted); margin-top:4px; }

      .h-scroll{ display:flex; gap:12px; overflow-x:auto; padding:4px 20px 8px; scrollbar-width:none; }
      .h-scroll::-webkit-scrollbar{ display:none; }
      .mini-card{ min-width:130px; background:var(--paper); border:1px solid var(--line); border-radius:var(--r-md); overflow:hidden; flex-shrink:0; box-shadow:var(--shadow-sm); transition: transform .15s var(--ease); }
      .mini-band{ color:#fff; font-size:10px; font-weight:700; padding:3px 8px; }
      .mini-img, .mini-img-box{ width:100%; height:90px; object-fit:contain; background:var(--cream); padding:6px; display:block; }
      .mini-img-box{ display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; color:#c9c0ae; text-align:center; }
      .mini-img-box span{ font-size:8.5px; line-height:1.3; padding:0 6px; }
      .mini-name{ font-size:12px; font-weight:700; padding:6px 8px 10px; }

      /* Smart image fallback (generic) */
      .img-fallback{ display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px; color:#b4ab97; background:var(--cream); width:100%; height:100%; text-align:center; }
      .img-fallback-compact{ gap:0; padding:0; }
      .img-fallback-compact span{ display:none; }
      .img-fallback span{ font-size:11px; font-weight:700; line-height:1.4; padding:0 10px; }

      .link-more{ display:flex; align-items:center; gap:4px; background:none; border:none; color:var(--primary); font-weight:700; font-size:13px; padding:2px 20px 4px; }

      .news-list{ padding:0 20px; display:flex; flex-direction:column; gap:8px; }
      .news-row{ display:flex; gap:10px; background:var(--paper); border:1px solid var(--line); border-radius:12px; padding:10px 12px; }
      .news-row-date{ font-size:11px; color:var(--gold); font-weight:700; white-space:nowrap; }
      .news-row-title{ font-weight:700; font-size:13.5px; }
      .news-row-place{ display:flex; align-items:center; gap:4px; font-size:11px; color:var(--muted); margin-top:2px; }

      .bottom-spacer{ height:20px; }

      /* Topbar */
      .topbar{ display:flex; align-items:center; gap:10px; padding:16px 16px 12px; background:var(--cream); position:sticky; top:0; z-index:5; }
      .topbar h1{ font-size:var(--fs-h3); font-family:var(--font-ui); font-weight:700; flex:1; }
      .topbar-logo{ width:30px; }
      .topbar-right{ min-width:20px; }
      .icon-btn{ background:var(--paper); border:1px solid var(--line); width:36px; height:36px; border-radius:var(--r-sm); display:flex; align-items:center; justify-content:center; box-shadow:var(--shadow-sm); transition: transform .15s var(--ease); }
      .icon-btn.danger{ color:#c0392b; }

      .content-pad{ padding:0 18px 30px; }
      .card.soft{ background:var(--paper); border:1px solid var(--line); border-radius:var(--r-xl); padding:var(--sp-4); box-shadow:var(--shadow-sm); }
      .card.center{ text-align:center; }
      /* بطاقة "عن الشركة": تصميم أكثر فخامة — حد علوي ذهبي رفيع، خلفية متدرّجة
         هادئة، علامة اقتباس ذهبية أكبر بخط زخرفي، ونص بفقرة مريحة القراءة
         بتباعد أحرف وسطور مدروس بدل الخط الأساسي العادي. */
      /* بطاقة الرسم التوضيحي (بديل احترافي عن الصور الفوتوغرافية غير المتوفرة) */
      .hero-illustration-card{ position:relative; overflow:hidden; border-radius:var(--r-xl); border:1px solid var(--line); box-shadow:var(--shadow-md); margin-bottom:var(--sp-4); background:var(--paper); }
      .hero-illustration{ display:block; width:100%; height:auto; }
      .hero-photo{ display:block; width:100%; height:190px; object-fit:cover; }
      .hero-illustration-caption{ position:absolute; bottom:10px; right:14px; left:14px; text-align:center; font-size:10.5px; color:#fff; background:rgba(15,45,82,0.55); backdrop-filter:blur(2px); border-radius:20px; padding:4px 10px; letter-spacing:0.2px; }

      .about-lead-card{
        position:relative; overflow:hidden;
        background:linear-gradient(165deg, var(--paper) 0%, var(--cream) 100%);
        border:1px solid var(--line);
        border-top:3px solid var(--gold);
        box-shadow:var(--shadow-md);
        padding:28px 22px 22px;
      }
      .about-lead-card::before{
        content:"❝"; position:absolute; top:-18px; right:10px;
        font-size:92px; color:var(--gold); opacity:0.16;
        font-family:var(--font-serif); font-style:italic; line-height:1; z-index:0;
      }
      .about-lead-card .lead{ position:relative; z-index:1; }
      .lead{
        font-size:14.5px; line-height:2.05; margin:0;
        font-weight:500; letter-spacing:0.15px; color:var(--ink);
      }

      .info-grid{ display:flex; flex-direction:column; gap:10px; margin-top:14px; }
      .info-grid.colorful .info-row{ box-shadow:0 3px 10px rgba(36,28,21,0.06); transition: transform .2s ease; }
      .info-grid.colorful .info-row:active{ transform:scale(0.98); }
      .info-row{ display:flex; gap:var(--sp-3); background:var(--paper); border:1px solid var(--line); border-radius:var(--r-md); padding:var(--sp-3) var(--sp-3); align-items:flex-start; box-shadow:var(--shadow-sm); }
      .info-row-link{ display:block; text-decoration:none; color:inherit; }
      .info-row-link:active .info-row{ transform:scale(0.98); }
      .info-row-icon{ width:32px; height:32px; border-radius:9px; background:var(--cream); display:flex; align-items:center; justify-content:center; color:var(--primary); flex-shrink:0; border:1px solid transparent; transition: all .2s ease; }
      .info-row-label{ font-size:11px; color:var(--muted); }
      .info-row-value{ font-size:13.5px; font-weight:700; }

      .source-note{ display:flex; align-items:center; gap:6px; font-size:11.5px; color:var(--muted); margin-top:12px; }
      .hint{ font-size:12.5px; color:var(--muted); line-height:1.8; margin-top:10px; }
      .hint.no-margin{ margin-top:6px; }
      .hint.tiny{ font-size:11px; }

      /* Timeline */
      .timeline{ position:relative; padding-inline-start:26px; margin-top:var(--sp-2); }
      .timeline::before{ content:""; position:absolute; inset-inline-start:13px; top:6px; bottom:6px; width:2px; background:linear-gradient(var(--line), var(--line)); }
      .tl-item{ position:relative; padding-bottom:var(--sp-6); padding-inline-start:var(--sp-4); }
      .tl-item:last-child{ padding-bottom:0; }
      .tl-dot{ position:absolute; inline-size:28px; block-size:28px; border-radius:50%; background:linear-gradient(145deg, var(--primary), #0A1E38); inset-inline-start:-27px; top:-1px; border:3px solid var(--cream); display:flex; align-items:center; justify-content:center; box-shadow:var(--shadow-md); z-index:1; }
      .tl-year{ display:inline-flex; font-family:var(--font-ui); color:#fff; background:var(--primary); font-weight:800; font-size:13px; padding:2px 12px; border-radius:20px; margin-bottom:var(--sp-2); letter-spacing:0.3px; }
      .tl-card{ background:var(--paper); border:1px solid var(--line); border-radius:var(--r-md); padding:var(--sp-4); box-shadow:var(--shadow-sm); }
      .tl-title{ font-family:var(--font-ui); font-weight:700; margin-bottom:var(--sp-1); font-size:var(--fs-h4); color:var(--ink); }
      .tl-card p{ color:var(--muted); font-size:var(--fs-body); line-height:1.7; margin:0; }
      .tl-card p{ font-size:12.5px; color:var(--muted); margin:0; line-height:1.7; }

      /* Search & chips */
      .search-box{ display:flex; align-items:center; gap:var(--sp-2); background:var(--paper); border:1.5px solid var(--line); border-radius:var(--r-md); padding:var(--sp-3) var(--sp-4); margin:var(--sp-3) 0; box-shadow:var(--shadow-sm); transition: border-color .15s var(--ease); }
      .search-box:focus-within{ border-color:var(--primary); }

      .products-banner{ margin:0 18px 4px; padding:18px 16px; border-radius:20px; text-align:center; color:#fff;
        background: linear-gradient(120deg, #0F2D52 0%, #0A1E38 60%, #1B2430 100%);
        background-size:200% 200%; animation: shimmerGrad 8s ease-in-out infinite;
        box-shadow:0 10px 24px rgba(28,78,156,0.25); position:relative; overflow:hidden; }
      .products-banner-icon{ display:flex; align-items:center; justify-content:center; width:44px; height:44px; border-radius:50%; background:rgba(255,255,255,0.15); margin:0 auto 6px; color:#fff; }
      .products-banner-title{ font-family:var(--font-ui); font-size:19px; letter-spacing:0.3px; }
      .products-banner-sub{ font-size:11.5px; opacity:0.85; margin-top:3px; }

      /* Big single-box product showcase (cycles through ALL products) */
      .big-showcase{ margin:14px 18px 6px; }
      .big-showcase-box{ position:relative; border-radius:22px; padding:16px; box-shadow:0 10px 26px rgba(36,28,21,0.12); cursor:pointer; overflow:hidden; }
      .big-showcase-brand{ position:absolute; top:14px; right:14px; color:#fff; font-size:11px; font-weight:800; padding:5px 12px; border-radius:10px; z-index:2; }
      .big-showcase-variants{ position:absolute; top:14px; left:14px; background:linear-gradient(120deg,var(--gold),#a9761f); color:#fff; font-size:10px; font-weight:800; padding:5px 10px; border-radius:20px; z-index:2; box-shadow:0 3px 8px rgba(200,155,60,0.4); }
      .big-showcase-discount{ position:absolute; top:50px; left:14px; background:#c0392b; color:#fff; font-size:10px; font-weight:800; padding:4px 10px; border-radius:20px; z-index:2; animation: pulseRing 1.6s ease-in-out infinite; }
      .big-showcase-img-wrap{ height:260px; display:flex; align-items:center; justify-content:center; animation: bigShowcaseFade 0.5s ease both; }
      .big-showcase-img{ max-width:98%; max-height:100%; width:auto; height:auto; object-fit:contain; animation: gentleFloat 4.5s ease-in-out infinite; }
      .big-showcase-img-box{ width:100%; height:100%; }
      .big-showcase-img-box .img-fallback{ background:transparent; }
      .big-showcase-img-box .img-fallback svg{ background:rgba(255,255,255,0.7); border-radius:50%; padding:16px; box-shadow:0 4px 14px rgba(0,0,0,0.06); }
      .big-showcase-img-box .img-fallback span{ font-size:12px; max-width:200px; }
      @keyframes bigShowcaseFade{ from{ opacity:0; transform:scale(0.9);} to{ opacity:1; transform:scale(1);} }
      .big-showcase-caption{ text-align:center; padding-top:8px; border-top:1px solid rgba(0,0,0,0.06); }
      .big-showcase-name{ font-family:var(--font-ui); font-weight:700; font-size:16px; color:var(--ink); }
      .big-showcase-type{ font-size:11.5px; color:var(--muted); margin-top:2px; }
      .featured-dots{ display:flex; justify-content:center; gap:5px; margin-top:12px; flex-wrap:wrap; padding:0 10px; }
      .featured-dot{ width:6px; height:6px; border-radius:50%; background:var(--line); transition:all .3s ease; }
      .featured-dot.active{ width:16px; border-radius:4px; }

      /* Card entrance: subtle 3D rotate-in */
      /* أزلنا حركة الدخول ثلاثية الأبعاد (rotateY + perspective) من هذا الغلاف
         أيضًا لنفس السبب أعلاه: تراكم عشرات الطبقات ثلاثية الأبعاد أثناء
         التمرير هو أكثر عرضة لهذا الخلل. */
      .product-card-spin-wrap{ }
      @keyframes cardRotateIn{
        from{ opacity:0; transform: rotateY(-25deg) translateY(14px) scale(0.92); }
        to{ opacity:1; transform: rotateY(0) translateY(0) scale(1); }
      }
      @keyframes spin360{ from{ transform:rotate(0deg);} to{ transform:rotate(360deg);} }
      .chip-emoji{ font-size:12px; }
      .search-box input{ border:none; outline:none; background:transparent; font-size:13.5px; flex:1; color:var(--ink); }
      .chip-row{ display:flex; gap:8px; overflow-x:auto; padding-bottom:10px; }
      .sort-row{ display:flex; align-items:center; gap:8px; margin-bottom:12px; }
      .sort-label{ font-size:12px; color:var(--muted); white-space:nowrap; }
      .sort-select{ flex:1; background:var(--paper); border:1.5px solid var(--line); border-radius:var(--r-sm); padding:var(--sp-2) var(--sp-3); font-size:var(--fs-small); font-weight:700; color:var(--ink); font-family:var(--font-ui); }
      .quick-brands-row{ display:grid; grid-template-columns:repeat(3,1fr); gap:10px; padding:0 18px 4px; }
      .quick-brand-btn{ display:flex; flex-direction:column; align-items:center; gap:4px; border:1.5px solid; border-radius:14px; padding:12px 6px; box-shadow:0 3px 10px rgba(36,28,21,0.06); }
      .quick-brand-btn:active{ transform:scale(0.95); }
      .quick-brand-dot{ width:22px; height:22px; border-radius:50%; display:block; }
      .quick-brand-name{ font-size:12px; font-weight:800; }
      .chip{ background:var(--paper); border:1.5px solid var(--line); padding:var(--sp-2) var(--sp-4); border-radius:var(--r-lg); font-size:var(--fs-small); font-weight:700; white-space:nowrap; display:inline-flex; align-items:center; gap:4px; transition: transform .15s var(--ease); }
      .chip:active{ transform:scale(0.94); }
      .chip.active{ background:var(--ink); color:#fff; border-color:var(--ink); box-shadow:0 4px 12px rgba(36,28,21,0.25); transform:scale(1.04); }

      /* Product grid/card */
      .product-grid{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
      .product-card{ background:var(--paper); border:2px solid transparent; border-radius:var(--r-xl); padding:var(--sp-3); position:relative; box-shadow:var(--shadow-md); transition: transform .15s var(--ease), box-shadow .15s var(--ease); }
      .product-card:active{ transform:scale(0.97); }
      .product-band{ position:absolute; top:10px; right:10px; color:#fff; font-size:9px; font-weight:700; padding:3px 8px; border-radius:6px; z-index:2; display:flex; align-items:center; gap:3px; }
      .hot-badge{ position:absolute; top:10px; left:42px; background:#F5A524; color:#fff; font-size:8.5px; font-weight:800; padding:3px 7px; border-radius:6px; z-index:2; animation: pulseRing 1.6s ease-in-out infinite; }
      .variants-ribbon{ position:absolute; bottom:10px; right:10px; background:linear-gradient(120deg,var(--gold),#a9761f); color:#fff; font-size:8.5px; font-weight:800; padding:4px 9px; border-radius:20px; z-index:2; box-shadow:0 3px 8px rgba(200,155,60,0.4); animation: floatY 2.6s ease-in-out infinite; display:flex; align-items:center; gap:3px; }
      .mini-variant-row{ display:flex; flex-wrap:wrap; gap:4px; margin-top:6px; }
      .mini-variant-dot{ font-size:9px; background:var(--cream); border:1px solid var(--line); border-radius:8px; padding:2px 7px; color:var(--muted); font-weight:700; }
      .product-type-emoji{ position:absolute; top:6px; left:6px; font-size:15px; opacity:0.85; z-index:1; }
      .fav-btn{ position:absolute; top:8px; left:8px; background:#fff; border:1px solid var(--line); width:28px; height:28px; border-radius:50%; display:flex; align-items:center; justify-content:center; z-index:2; }
      .product-img-wrap{ background:var(--cream); border-radius:12px; height:110px; display:flex; align-items:center; justify-content:center; overflow:hidden; margin-top:6px; cursor:pointer; position:relative; }
      .prod-img{ max-width:108%; max-height:108%; width:auto; height:auto; object-fit:contain; animation: gentleFloat 4.5s ease-in-out infinite; }
      @keyframes gentleFloat{ 0%,100%{ transform:translateY(0);} 50%{ transform:translateY(-5px);} }

      .marquee-wrap{ overflow:hidden; margin:12px 0 4px; -webkit-mask-image: linear-gradient(90deg, transparent, #000 8%, #000 92%, transparent); mask-image: linear-gradient(90deg, transparent, #000 8%, #000 92%, transparent); }
      .marquee-track{ display:flex; gap:10px; width:max-content; animation: marqueeScroll 22s linear infinite; padding:2px 4px; }
      .marquee-item{ flex-shrink:0; width:52px; height:52px; border-radius:14px; background:var(--paper); border:2px solid var(--line); padding:5px; box-shadow:0 3px 8px rgba(36,28,21,0.06); }
      .marquee-img, .marquee-img-box{ width:100%; height:100%; object-fit:contain; }
      @keyframes marqueeScroll{ from{ transform:translateX(0);} to{ transform:translateX(50%);} }
      .prod-img-box{ background:transparent; }
      .prod-img-box span{ font-size:10px; }
      .product-body{ padding:10px 2px 0; }
      .product-type{ font-size:10.5px; color:var(--muted); }
      .product-name{ font-family:var(--font-ui); font-weight:700; font-size:var(--fs-h4); margin:3px 0; line-height:1.3; }
      .product-desc{ font-size:11px; color:var(--muted); line-height:1.5; min-height:32px; }
      .product-price-row{ display:flex; align-items:center; gap:6px; margin-top:6px; flex-wrap:wrap; }
      .price-old{ font-size:11px; color:var(--muted); text-decoration:line-through; }
      .price-now{ font-size:13px; font-weight:800; color:var(--primary); }
      .price-badge{ background:var(--primary); color:#fff; font-size:9.5px; font-weight:700; padding:2px 6px; border-radius:8px; animation: pulseRing 1.8s ease-in-out infinite; }
      .price-old.lg{ font-size:14px; }
      .price-now.lg{ font-size:19px; }

      .empty-state{ text-align:center; padding:40px 20px; color:var(--muted); }
      .empty-state p{ font-size:13px; margin-top:8px; }

      /* Product detail */
      .pd-hero{ height:220px; display:flex; align-items:center; justify-content:center; position:relative; overflow:hidden; }
      .pd-hero-img-pop{ animation: heroPopIn 0.5s cubic-bezier(.22,1,.36,1) both; }
      @keyframes heroPopIn{ from{ opacity:0; transform:scale(0.75) rotate(-6deg);} to{ opacity:1; transform:scale(1) rotate(0);} }
      .pd-anim{ animation: fadeInUp 0.45s ease both; }
      .pd-hero-img{ max-height:100%; max-width:92%; width:auto; height:auto; object-fit:contain; cursor:zoom-in; }
      .pd-hero-fallback{ width:70%; height:82%; cursor:default; }
      .pd-hero-hint{ position:absolute; bottom:10px; left:50%; transform:translateX(-50%); background:rgba(36,28,21,0.55); color:#fff; font-size:10.5px; padding:4px 10px; border-radius:20px; display:flex; align-items:center; gap:4px; pointer-events:none; }
      .pd-variants-ribbon{ position:absolute; top:12px; left:12px; background:linear-gradient(120deg,var(--gold),#a9761f); color:#fff; font-size:10.5px; font-weight:800; padding:5px 12px; border-radius:20px; box-shadow:0 4px 12px rgba(200,155,60,0.4); animation: popIn 0.4s ease both, floatY 3s ease-in-out infinite 0.4s; }
      .variant-picker{ margin:12px 0; background:var(--cream); border:1.5px solid var(--line); border-radius:14px; padding:12px; }
      .variant-picker-title{ font-size:12px; font-weight:700; color:var(--ink); margin-bottom:8px; }
      .variant-chip-row{ display:flex; gap:8px; flex-wrap:wrap; }
      .variant-chip{ background:var(--paper); border:1.5px solid var(--line); padding:var(--sp-2) var(--sp-4); border-radius:var(--r-md); font-size:var(--fs-small); font-weight:700; transition: all .2s var(--ease); box-shadow:var(--shadow-sm); }
      .variant-chip.active{ box-shadow:0 5px 14px rgba(36,28,21,0.25); transform:scale(1.07); font-weight:800; }
      .variant-chip.active{ box-shadow:0 4px 14px rgba(0,0,0,0.18); transform:scale(1.05); }
      .lightbox-backdrop{ position:fixed; inset:0; background:rgba(15,11,7,0.92); z-index:80; display:flex; align-items:center; justify-content:center; padding:30px 20px; }
      .lightbox-img{ max-width:100%; max-height:80vh; object-fit:contain; }
      .lightbox-fallback{ width:260px; height:260px; border-radius:16px; }
      .lightbox-close{ position:absolute; top:20px; left:20px; background:rgba(255,255,255,0.12); border:1px solid rgba(255,255,255,0.3); color:#fff; width:38px; height:38px; border-radius:50%; display:flex; align-items:center; justify-content:center; }
      .pd-head{ display:flex; justify-content:space-between; align-items:center; margin:14px 0 6px; }
      .pill{ font-size:11px; font-weight:700; padding:4px 12px; border-radius:20px; }
      .pd-title{ font-size:21px; margin-top:8px; }
      .pd-type{ color:var(--muted); font-size:13px; margin:2px 0 10px; }
      .pd-desc{ font-size:13.5px; line-height:1.8; }
      .pd-facts{ display:flex; flex-direction:column; gap:10px; margin-top:14px; }

      /* Rating stars */
      .star-row{ display:flex; gap:2px; }
      .star{ color:#F5A524; line-height:1; }
      .star.interactive{ cursor:pointer; transition:transform .15s ease; }
      .star.interactive:active{ transform:scale(1.3); }
      .pd-rating-row{ display:flex; align-items:center; gap:6px; margin:6px 0 10px; }
      .pd-rating-row.muted{ opacity:0.7; }
      .pd-rating-num{ font-weight:800; font-size:13px; }
      .pd-rating-count{ font-size:11px; color:var(--muted); }

      /* Reviews */
      .reviews-section{ margin-top:20px; }
      .reviews-list{ display:flex; flex-direction:column; gap:10px; margin:10px 0 16px; }
      .review-card{ background:var(--paper); border:1px solid var(--line); border-radius:14px; padding:12px; animation: fadeInUp 0.35s ease both; }
      .review-head{ display:flex; justify-content:space-between; align-items:center; margin-bottom:4px; }
      .review-name{ font-weight:700; font-size:12.5px; }
      .review-comment{ font-size:12.5px; color:var(--ink); line-height:1.7; margin:0; }
      .review-form{ background:var(--paper); border:1px dashed var(--line); border-radius:16px; padding:14px; }
      .review-form-title{ font-weight:700; font-size:13px; margin-bottom:8px; }
      .review-form .star-row{ margin-bottom:10px; }

      /* Sticky buy bar */
      .sticky-buy-bar{ position:fixed; bottom:78px; left:50%; transform:translateX(-50%); width:100%; max-width:480px; background:var(--paper); border-top:1px solid var(--line); box-shadow:0 -6px 18px rgba(15,45,82,0.1); padding:var(--sp-3) var(--sp-4); display:flex; align-items:center; justify-content:space-between; gap:var(--sp-3); z-index:25; animation: fadeInUp 0.3s var(--ease); }
      .whatsapp-btn{ flex-shrink:0; background:#25D366; border:none; text-decoration:none; }

      .related-section{ margin-top:20px; padding-top:16px; border-top:1px solid var(--line); }
      .related-section .section-title-row h3{ font-family:var(--font-ui); font-size:16px; margin-bottom:10px; }
      .related-scroll{ display:flex; gap:10px; overflow-x:auto; padding-bottom:4px; }
      .related-card{ flex-shrink:0; width:110px; background:var(--paper); border:1px solid var(--line); border-radius:var(--r-md); padding:var(--sp-2); text-align:center; box-shadow:var(--shadow-sm); transition: transform .15s var(--ease); }
      .related-img, .related-img-box{ transition: transform .3s cubic-bezier(.25,.8,.25,1); }
      .related-card:hover .related-img, .related-card:active .related-img{ transform:scale(1.1); }
      .big-showcase-box{ transition: box-shadow .25s ease; }
      .big-showcase-box:hover .big-showcase-img, .big-showcase-box:active .big-showcase-img{ transform:scale(1.06) !important; animation-play-state:paused; }
      .related-card:active{ transform:scale(0.96); }
      .related-img, .related-img-box{ width:100%; height:70px; object-fit:contain; margin-bottom:6px; }
      .related-name{ font-size:11px; font-weight:700; color:var(--ink); line-height:1.3; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; min-height:28px; }
      .related-price{ font-size:11.5px; font-weight:800; color:var(--primary); margin-top:4px; }
      .sticky-buy-info{ display:flex; flex-direction:column; }
      .sticky-buy-price{ font-weight:800; font-size:16px; color:var(--primary); }
      .sticky-buy-qty{ font-size:10.5px; color:var(--muted); }
      .sticky-buy-btn{ flex-shrink:0; }

      /* Order stepper */
      .order-stepper{ display:flex; align-items:flex-start; margin:12px 0; }
      .order-step{ flex:1; display:flex; flex-direction:column; align-items:center; position:relative; }
      .order-step-dot{ width:26px; height:26px; border-radius:50%; background:var(--cream); border:2px solid var(--line); display:flex; align-items:center; justify-content:center; font-size:11px; z-index:2; transition: background .3s ease, border-color .3s ease; }
      .order-step.done .order-step-dot{ background:var(--primary); border-color:var(--primary); color:#fff; }
      .order-step-label{ font-size:9.5px; color:var(--muted); margin-top:5px; text-align:center; }
      .order-step.done .order-step-label{ color:var(--ink); font-weight:700; }
      .order-step-line{ position:absolute; top:12px; right:50%; width:100%; height:2px; background:var(--line); z-index:1; }
      .order-step-line.done{ background:var(--primary); }
      .order-cancelled{ background:#FBEAEA; color:#b3261e; border-radius:10px; padding:10px; text-align:center; font-weight:700; font-size:12.5px; margin:10px 0; }
      .pd-buy-box{ background:var(--paper); border:1.5px solid var(--line); border-radius:16px; padding:14px; margin-top:14px; }
      .pd-buy-box.muted{ display:flex; align-items:center; gap:8px; color:var(--muted); font-size:12.5px; background:var(--cream); border-style:dashed; }
      .pd-price-row{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:12px; }
      .pd-qty-row{ display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; }
      .pd-qty-label{ font-size:12.5px; color:var(--muted); font-weight:700; }
      .qty-stepper{ display:flex; align-items:center; gap:10px; background:var(--cream); border:1px solid var(--line); border-radius:12px; padding:4px 8px; }
      .qty-stepper button{ width:26px; height:26px; border-radius:8px; background:var(--paper); border:1px solid var(--line); display:flex; align-items:center; justify-content:center; }
      .qty-stepper span{ min-width:18px; text-align:center; font-weight:700; font-size:13px; }
      .qty-stepper.small{ padding:2px 6px; gap:6px; margin-top:6px; }
      .qty-stepper.small button{ width:20px; height:20px; }
      .qty-stepper.small span{ font-size:11.5px; min-width:14px; }
      .fact-row{ display:flex; gap:var(--sp-3); background:var(--paper); border:1px solid var(--line); padding:var(--sp-4); border-radius:var(--r-md); box-shadow:var(--shadow-sm); }
      .accordion-row{ background:var(--paper); border:1px solid var(--line); border-radius:var(--r-md); overflow:hidden; box-shadow:var(--shadow-sm); }
      .accordion-header{ width:100%; display:flex; align-items:center; justify-content:space-between; padding:12px; background:none; border:none; font-size:13px; font-weight:700; color:var(--ink); }
      .accordion-header-left{ display:flex; align-items:center; gap:8px; }
      .accordion-chevron{ transition: transform .25s ease; }
      .accordion-chevron.open{ transform:rotate(-90deg); }
      .accordion-body{ padding:0 14px 14px 40px; font-size:13px; color:var(--muted); line-height:1.8; animation: fadeIn 0.2s ease; }
      .fact-label{ font-size:11px; color:var(--muted); }
      .fact-value{ font-size:13px; font-weight:700; margin-top:2px; }

      /* Awards */
      .award-cat-title{ display:flex; align-items:center; gap:6px; font-weight:700; margin-bottom:var(--sp-2); font-size:var(--fs-h4); color:var(--ink); }
      .order-item-row{ display:flex; justify-content:space-between; padding:8px 0; font-size:13px; border-bottom:1px solid var(--line); }
      .order-item-row:last-of-type{ border-bottom:none; }
      .order-item-total{ font-weight:800; color:var(--primary); border-top:1.5px solid var(--line); margin-top:4px; padding-top:10px; }
      .delivery-method-row{ display:flex; flex-direction:column; gap:8px; margin-bottom:10px; }
      .delivery-chip{ display:flex; align-items:center; gap:8px; background:var(--paper); border:1.5px solid var(--line); border-radius:var(--r-md); padding:var(--sp-3) var(--sp-4); font-size:var(--fs-body); font-weight:700; text-align:right; transition: transform .15s var(--ease); }
      .delivery-chip:active{ transform:scale(0.97); }
      .delivery-chip.active{ background:var(--primary); border-color:var(--primary); color:#fff; }
      .wholesale-row{ margin-bottom:12px; padding-bottom:12px; border-bottom:1px solid var(--line); }
      .wholesale-row:last-of-type{ border-bottom:none; margin-bottom:6px; padding-bottom:0; }
      .wholesale-row-inline{ display:flex; gap:8px; align-items:center; }
      .wholesale-row-inline .admin-input{ margin-bottom:0; }
      .wholesale-row-inline input[type=number]{ width:64px; flex-shrink:0; text-align:center; }
      .fab-whatsapp{ position:fixed; bottom:80px; right:14px; width:42px; height:42px; border-radius:50%; background:#25D366; display:flex; align-items:center; justify-content:center; box-shadow:0 4px 12px rgba(37,211,102,0.4); z-index:24; animation: fabBounce 2.2s ease-in-out infinite; }
      .fab-whatsapp:active{ transform:scale(0.9); }
      @keyframes fabBounce{ 0%,100%{ transform:translateY(0);} 50%{ transform:translateY(-6px);} }
      .award-emoji{ font-size:16px; }
      .award-card{ position:relative; overflow:hidden; }
      .award-card-v2{ position:relative; overflow:hidden; box-shadow:0 3px 10px rgba(36,28,21,0.06); }
      .award-cat-title-v2{ display:flex; align-items:center; gap:10px; font-weight:800; margin-bottom:10px; font-size:15px; font-family:var(--font-ui); color:var(--ink); }
      .award-icon-badge{ width:38px; height:38px; border-radius:12px; display:flex; align-items:center; justify-content:center; font-size:18px; border:1px solid transparent; flex-shrink:0; }
      .cert-badge-row{ display:flex; flex-direction:column; gap:8px; }
      .cert-badge{ display:flex; align-items:center; gap:8px; background:var(--cream); border:1px solid var(--line); border-radius:12px; padding:10px 14px; font-size:13px; font-weight:700; color:var(--ink); }
      .award-empty{ display:flex; align-items:center; gap:8px; background:var(--cream); border-radius:12px; padding:12px 14px; }
      .award-empty p{ font-size:12.5px; }

      /* بانر مصغّر أصبح "هيدر بصري" احترافي لكل الصفحات (عن الشركة، الموظفون،
         الفروع، الوصفات...): أيقونة كبيرة شبحية في الخلفية تعطي إحساس صورة/غلاف
         بدل اللوحة اللونية البسيطة، مع حد ذهبي سفلي وتوهّج خفيف لعمق أكبر. */
      .mini-banner{ position:relative; overflow:hidden; margin:0 18px 4px; padding:26px 18px 22px; border-radius:20px; text-align:center; color:#fff;
        background: linear-gradient(135deg, #0F2D52 0%, #0A1E38 55%, #1B2430 100%);
        background-size:200% 200%; animation: shimmerGrad 9s ease-in-out infinite;
        box-shadow:0 10px 26px rgba(28,78,156,0.26); border-bottom:3px solid var(--gold); }
      .mini-banner::after{ content:""; position:absolute; inset:0;
        background:radial-gradient(circle at 85% -15%, rgba(166,134,61,0.35), transparent 55%),
                   radial-gradient(circle at -10% 115%, rgba(255,255,255,0.08), transparent 50%);
        pointer-events:none; }
      .mini-banner-ghost-icon{ position:absolute; top:-22px; left:-14px; opacity:0.10; color:#fff; transform:rotate(-12deg); pointer-events:none; }
      .mini-banner-inner{ position:relative; z-index:1; }
      .mini-banner-icon{ display:flex; align-items:center; justify-content:center; width:46px; height:46px; border-radius:50%; background:rgba(255,255,255,0.14); border:1.5px solid rgba(255,255,255,0.3); margin:0 auto 10px; color:var(--gold); }
      .mini-banner-title{ font-family:var(--font-ui); font-weight:700; font-size:var(--fs-h2); letter-spacing:0.2px; }
      .mini-banner-sub{ font-size:11.5px; opacity:0.85; margin-top:4px; }
      .bullet-list{ margin:0; padding-inline-start:18px; font-size:13px; color:var(--ink); line-height:2; }

      /* News cards */
      .news-card{ background:var(--paper); border:1px solid var(--line); border-radius:var(--r-lg); overflow:hidden; margin-bottom:var(--sp-3); box-shadow:var(--shadow-sm); transition: transform .15s var(--ease), box-shadow .15s var(--ease); }
      .news-card:active{ transform:scale(0.98); box-shadow:var(--shadow-md); }
      .news-card-img{ height:120px; background:var(--cream); display:flex; align-items:center; justify-content:center; overflow:hidden; }
      .news-img{ max-height:100%; max-width:100%; width:auto; height:auto; object-fit:contain; }
      .news-img-box span{ font-size:10px; }
      .news-card-body{ padding:14px; }
      .news-card-date{ display:flex; align-items:center; gap:5px; font-size:11px; color:var(--gold); font-weight:700; }
      .news-card-title{ font-family:var(--font-ui); font-size:16px; margin:4px 0; }
      .news-card-place{ display:flex; align-items:center; gap:4px; font-size:11.5px; color:var(--muted); margin-bottom:8px; }
      .news-card-body p{ font-size:13px; line-height:1.8; margin:0 0 10px; }

      /* Map */
      .map-embed{ border-radius:14px; overflow:hidden; height:190px; border:1px solid var(--line); margin-bottom:14px; }
      .map-embed iframe{ width:100%; height:100%; border:0; }
      .cta-row{ display:flex; gap:10px; margin-top:14px; }
      .cta-row a{ flex:1; text-align:center; }

      .big-stat{ font-family:var(--font-ui); font-size:22px; color:var(--primary); font-weight:700; margin:6px 0; }

      /* Recipes */
      .recipe-grid{ display:flex; flex-direction:column; gap:12px; }
      .recipe-card{ background:var(--paper); border:1px solid var(--line); border-radius:var(--r-lg); overflow:hidden; display:flex; box-shadow:var(--shadow-sm); transition: transform .15s var(--ease); }
      .recipe-card:active{ transform:scale(0.98); }
      .recipe-img{ width:100px; height:100px; object-fit:cover; flex-shrink:0; }
      .recipe-img-box{ width:100px; height:100px; flex-shrink:0; padding:4px; }
      .recipe-img-box span{ font-size:9px; }
      .recipe-body{ padding:10px 12px; flex:1; }
      .recipe-title{ font-weight:700; font-size:14px; font-family:var(--font-ui); }
      .recipe-meta{ display:flex; align-items:center; gap:5px; font-size:11px; color:var(--muted); margin:4px 0 6px; }

      .social-row{ display:flex; gap:10px; margin:14px 0; }
      .social-row a{ width:40px; height:40px; border-radius:12px; background:var(--paper); border:1px solid var(--line); display:flex; align-items:center; justify-content:center; }

      .source-row{ display:flex; align-items:center; gap:8px; padding:10px 0; border-bottom:1px solid var(--line); font-size:13px; }
      .source-row:last-child{ border-bottom:none; }

      /* Compare */
      .compare-table-wrap{ overflow-x:auto; margin-top:18px; }
      .compare-table{ width:100%; border-collapse:collapse; background:var(--paper); border-radius:12px; overflow:hidden; font-size:12px; }
      .compare-table th, .compare-table td{ border:1px solid var(--line); padding:8px; text-align:center; }
      .compare-table th img{ width:50px; height:50px; object-fit:contain; display:block; margin:0 auto 4px; }
      .compare-table td:first-child{ font-weight:700; background:var(--cream); text-align:start; }

      /* Admin */
      .admin-login-icon{ display:flex; align-items:center; justify-content:center; width:52px; height:52px; border-radius:50%; background:linear-gradient(145deg, var(--primary), #0A1E38); color:#fff; margin:0 auto; box-shadow:0 6px 16px rgba(15,45,82,0.25); }
      .admin-tab-hint{ display:flex; align-items:flex-start; gap:6px; font-size:12px; color:var(--muted); background:var(--cream); border-radius:10px; padding:9px 12px; margin:0 0 14px; line-height:1.6; }
      .admin-login{ display:flex; flex-direction:column; gap:10px; margin-top:14px; }
      .admin-login input{ border:1px solid var(--line); border-radius:10px; padding:11px 14px; font-size:13.5px; }
      .error-text{ color:#c0392b; font-size:12.5px; margin-top:8px; }
      .admin-input{ width:100%; border:1.5px solid var(--line); border-radius:var(--r-md); padding:var(--sp-3) var(--sp-3); font-size:var(--fs-body); margin-bottom:var(--sp-2); background:var(--cream); font-family:var(--font-ui); transition: border-color .15s var(--ease); }
      .admin-input:focus{ border-color:var(--primary); outline:none; }
      .admin-upload-btn{ display:flex; align-items:center; justify-content:center; gap:6px; background:var(--paper); border:1.5px dashed var(--primary); color:var(--primary); border-radius:10px; padding:10px; font-size:12.5px; font-weight:700; margin-bottom:8px; cursor:pointer; }
      .admin-img-preview-row{ display:flex; align-items:center; gap:10px; margin-bottom:4px; }
      .admin-upload-btn.small{ padding:6px 10px; font-size:11px; margin-bottom:0; flex-shrink:0; }
      .admin-upload-btn:active{ background:var(--cream); }
      .admin-variant-upload-row{ display:flex; align-items:center; gap:8px; margin-bottom:8px; }
      .admin-nested-sizes{ margin:4px 0 10px 18px; padding-right:10px; border-right:2px solid var(--line); }
      .admin-variant-label{ font-size:12px; font-weight:700; flex:1; }
      .admin-field{ margin-bottom:12px; }
      .admin-edit-full{ background:var(--cream); border:1px dashed var(--line); border-radius:12px; padding:12px; margin:8px 0; animation: fadeInUp 0.3s ease; }
      .admin-section{ background:var(--paper); border:1px solid var(--line); border-radius:var(--r-lg); padding:var(--sp-4); margin-bottom:var(--sp-3); box-shadow:var(--shadow-sm); }
      .admin-section-title{ display:flex; align-items:center; gap:8px; font-weight:800; font-size:13px; color:var(--primary); margin-bottom:10px; padding-bottom:8px; border-bottom:1px solid var(--line); }
