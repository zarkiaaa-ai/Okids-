/* ==============================
   نظام الصور: يحاول أولًا الصورة المحلية من مجلد assets (إن وُجدت)،
   ثم يحاول رابط الموقع الرسمي، وإن فشل الاثنان يعرض بطاقة أنيقة
   بدل أيقونة الصورة المكسورة — لا يوجد src فارغ أبدًا.
   ملاحظة: لتفعيل الصور المحلية ضع الملفات في:
   public/products/<id>.png  (نفس الـ id الموجود في بيانات المنتج)
   public/news/<id>.png · public/recipes/<id>.png
   ============================== */
function useImageSource(id, folder, remoteSrc) {
  const [tier, setTier] = useState(0);
  // import.meta.env.BASE_URL = '/' في وضع التطوير و '/Okids-/' بعد البناء لنشره على GitHub Pages
  const base = "/Okids-/"; // يطابق اسم المستودع zarkiaaa-ai/Okids-
  const sources = useMemo(
    () => [`${base}${folder}/${id}.png`, remoteSrc].filter(Boolean),
    [id, folder, remoteSrc, base]
  );
  const failed = tier >= sources.length;
  return { src: failed ? null : sources[tier], failed, onError: () => setTier((t) => t + 1) };
}

function SmartImage({ id, folder = "products", remoteSrc, alt, className, boxClassName, onClick, iconSize = 24, compact = false }) {
  const { src, failed, onError } = useImageSource(id, folder, remoteSrc);
  if (failed) {
    return (
      <div className={"img-fallback " + (compact ? "img-fallback-compact " : "") + (boxClassName || "")} onClick={onClick} role={onClick ? "button" : undefined}>
        <ImageIcon size={iconSize} />
        {!compact && <span>صورة المنتج غير متوفرة حاليًا</span>}
      </div>
    );
  }
  return (
    <img
      src={src}
      alt={alt}
      className={className}
      loading="lazy"
      referrerPolicy="no-referrer"
      onClick={onClick}
      onError={onError}
    />
  );
}

function formatPrice(n) {
  const v = Number(n) || 0;
  return v.toLocaleString("ar-DZ") + " دج";
}
function readImageAsDataURL(file, callback) {
  if (!file || !file.type || !file.type.startsWith("image/")) return;
  const reader = new FileReader();
  reader.onload = () => callback(reader.result);
  reader.readAsDataURL(file);
}
function effectivePrice(p) {
  const base = Number(p.price) || 0;
  const disc = Number(p.discount) || 0;
  if (!base) return 0;
  if (!disc) return base;
  return Math.round(base * (1 - disc / 100));
}

    if (raw) return JSON.parse(raw);
  } catch (e) { /* غير متوفر */ }

}

function ProductCard({ p, onOpen, fav, onToggleFav, compareMode, selected, onSelect }) {

  return (
    <div className="product-card" style={{ borderColor: selected ? color : "transparent" }}>
      <div className="product-band" style={{ background: color }}>{BRAND_EMOJI[p.brand]} {p.brand}</div>

        <Heart size={18} fill={fav ? "#E0455A" : "none"} color={fav ? "#E0455A" : "#8a8478"} />
      </button>
      <div className="product-img-wrap" style={{ background: `linear-gradient(160deg, ${tint}, #fff)` }} onClick={() => (compareMode ? onSelect(p.id) : onOpen(p.id))}>
        <span className="product-type-emoji">{typeEmoji(p.type)}</span>
        <SmartImage id={p.id} remoteSrc={p.img} alt={p.name} className="prod-img" boxClassName="prod-img-box" iconSize={22} />
      </div>
      <div className="product-body" onClick={() => (compareMode ? onSelect(p.id) : onOpen(p.id))}>
        <div className="product-type">{p.type}</div>
        <div className="product-name">{p.name}</div>
        <div className="product-desc">{p.desc}</div>
        {hasVariants && (
          <div className="mini-variant-row">
            {p.variants.map(v => <span key={v.id} className="mini-variant-dot">{v.label}</span>)}
          </div>
        )}
        {Number(p.price) > 0 && (
          <div className="product-price-row">
            {Number(p.discount) > 0 ? (
              <>
                <span className="price-old">{formatPrice(p.price)}</span>
                <span className="price-now">{formatPrice(effectivePrice(p))}</span>
                <span className="price-badge">-{p.discount}%</span>
              </>
            ) : (
              <span className="price-now">{formatPrice(p.price)}</span>
            )}
          </div>
        )}
      </div>
      {compareMode ? (
        <button className={"btn-outline small" + (selected ? " active" : "")} onClick={() => onSelect(p.id)} style={{ borderColor: color, color: selected ? "#fff" : color, background: selected ? color : "transparent" }}>
          {selected ? <><Check size={14}/> محدد</> : "اختيار للمقارنة"}
        </button>
      ) : (
        <button className="btn-outline small" style={{ borderColor: color, color }} onClick={() => onOpen(p.id)}>✨ التفاصيل</button>
      )}
    </div>
  );
}

        if (d.dataVersion !== DEFAULT_DATA.dataVersion) {
          // صدر تحديث لمحتوى المنتجات الحقيقي (مكونات/أوزان/إلخ) —
          // نستبدل كل المحتوى المعلوماتي بالنسخة الجديدة الصحيحة،
          // مع الحفاظ فقط على ما خصّصه صاحب المتجر يدويًا (الأسعار، الخصومات، التقييمات، الطلبات).
          const mergedProducts = DEFAULT_DATA.products.map(freshP => {
            const oldP = (d.products || []).find(x => x.id === freshP.id);
            return oldP
              ? { ...freshP, price: oldP.price ?? freshP.price, discount: oldP.discount ?? freshP.discount, reviews: oldP.reviews || [] }
              : freshP;
          });
          normalized = { ...DEFAULT_DATA, products: mergedProducts, orders: d.orders || [] };
          await saveData(normalized);
        } else {
          normalized = {
            ...d,
            orders: d.orders || [],
            products: (d.products || []).map(p => ({ price: 0, discount: 0, reviews: [], ...p })),
          };
        }
      }
      if (normalized) setData(normalized); else await saveData(DEFAULT_DATA);
      if (f) setFavs(f);
      if (c) setCart(c);
      if (rv) setRecentlyViewed(rv);
      setReady(true);
    })();
  }, []);

  const showToast = useCallback((msg) => {
    setToast(msg);
    setTimeout(() => setToast(""), 2200);
  }, []);

  const go = (s) => { setPrevScreen(screen); setScreen(s); setMoreSheet(false); window.scrollTo(0,0); };
  const openProduct = (id) => {
    setActiveProduct(id);
    go("productDetail");
    setRecentlyViewed(prev => {
      const next = [id, ...prev.filter(x => x !== id)].slice(0, 8);
      saveRecent(next);
      return next;
    });
  };

  const toggleFav = async (id) => {
    const next = favs.includes(id) ? favs.filter(x => x !== id) : [...favs, id];
    setFavs(next);
    await saveFavs(next);
  };

  const updateCart = async (mutator) => {
    setCart(prev => {
      const next = mutator([...prev]);
      saveCart(next);
      return next;
    });
  };
  const addToCart = (id, qty) => {
    updateCart(prev => {
      const existing = prev.find(x => x.id === id);
      if (existing) existing.qty += qty;
      else prev.push({ id, qty });
      return prev;
    });
    showToast("تمت الإضافة إلى السلة");
  };
  const setCartQty = (id, qty) => {
    updateCart(prev => {
      if (qty <= 0) return prev.filter(x => x.id !== id);
      const existing = prev.find(x => x.id === id);
      if (existing) existing.qty = qty;
      return prev;
    });
  };
  const removeFromCart = (id) => updateCart(prev => prev.filter(x => x.id !== id));
  const cartCount = cart.reduce((s, x) => s + x.qty, 0);

  const updateData = async (mutator) => {
    setData(prev => {
      const next = mutator(structuredClone(prev));
      saveData(next);
      return next;
    });
  };

  const submitOrder = async (customer) => {
    const items = cart.map(c => {
      const p = data.products.find(x => x.id === c.id);
      if (!p) return null;
      return { id: p.id, name: p.name, brand: p.brand, qty: c.qty, unitPrice: effectivePrice(p) };
    }).filter(Boolean);
    const total = items.reduce((s, it) => s + it.unitPrice * it.qty, 0);
    const order = {
      id: "ORD-" + Date.now().toString().slice(-8),
      date: new Date().toISOString(),
      customer,
      items,
      total,
      status: "جديد",
    };
    await updateData(d => { d.orders = [order, ...(d.orders || [])]; return d; });
    setCart([]);
    await saveCart([]);
    return order;
  };

  const filteredProducts = useMemo(() => {
    let list = data.products;
    if (activeBrandFilter !== "الكل") list = list.filter(p => p.brand === activeBrandFilter);
    if (query.trim()) {
      const q = query.trim().toLowerCase();
      list = list.filter(p =>
        p.name.toLowerCase().includes(q) || p.type.includes(q) || p.brand.toLowerCase().includes(q) ||
        p.desc.includes(q) || (q.includes("جبن") && true === true && (p.type.includes("جبن"))) ||
        (q.includes("حليب") && p.type.includes("حليب"))
      );
    }
    return list;
  }, [data.products, activeBrandFilter, query]);

  const product = useMemo(() => data.products.find(p => p.id === activeProduct), [data.products, activeProduct]);
  const compareProducts = compareIds.map(id => data.products.find(p => p.id === id)).filter(Boolean);

  const toggleCompareSelect = (id) => {
    setCompareIds(prev => {
      if (prev.includes(id)) return prev.filter(x => x !== id);
      if (prev.length >= 2) return [prev[1], id];
      return [...prev, id];
    });
  };

  if (!ready) {
    return (
      <div className="app-shell" dir="rtl"><Style />
        <div className="loading-screen premium">
          <div className="loading-glow" />
          <img src={LOGO} alt="OKID'S" referrerPolicy="no-referrer" className="loading-logo" style={{ width: 84 }} />
          <div className="loading-title">OKID'S</div>
          <div className="loading-sub">موسوعة الشركة ومنتجاتها</div>
          <div className="loading-bar"><div className="loading-bar-fill" /></div>
        </div>
      </div>
    );
  }

  return (
    <div className="app-shell" dir="rtl">
      <Style />
      <div className="app-frame">
        {screen === "home" && <HomeScreen data={data} go={go} openProduct={openProduct} recentlyViewed={recentlyViewed} />}
        {screen === "about" && <AboutScreen data={data} go={go} />}
        {screen === "history" && <HistoryScreen data={data} go={go} />}
        {screen === "products" && (
          <ProductsScreen
            products={filteredProducts} allProducts={data.products} go={go} openProduct={openProduct}
            brandFilter={activeBrandFilter} setBrandFilter={setActiveBrandFilter}
            query={query} setQuery={setQuery} favs={favs} toggleFav={toggleFav}
          />
        )}
        {screen === "productDetail" && product && (
          <ProductDetailScreen product={product} go={go} favs={favs} toggleFav={toggleFav} addToCart={addToCart} showToast={showToast} updateData={updateData} />
        )}
        {screen === "awards" && <AwardsScreen go={go} data={data} />}
        {screen === "news" && <NewsScreen data={data} go={go} />}
        {screen === "location" && <LocationScreen data={data} go={go} />}
        {screen === "employees" && <EmployeesScreen data={data} go={go} />}
        {screen === "branches" && <BranchesScreen data={data} go={go} />}
        {screen === "recipes" && <RecipesScreen data={data} go={go} />}
        {screen === "quality" && <QualityScreen data={data} go={go} />}
        {screen === "contact" && <ContactScreen data={data} go={go} />}
        {screen === "favorites" && (
          <FavoritesScreen products={data.products} favs={favs} go={go} openProduct={openProduct} toggleFav={toggleFav} />
        )}
        {screen === "compare" && (
          <CompareScreen products={data.products} compareIds={compareIds} toggleCompareSelect={toggleCompareSelect} compareProducts={compareProducts} go={go} />
        )}
        {screen === "sources" && <SourcesScreen data={data} go={go} />}
        {screen === "myorders" && <MyOrdersScreen data={data} go={go} />}
        {screen === "cart" && (
          <CartScreen
            cart={cart} products={data.products} go={go}
            setCartQty={setCartQty} removeFromCart={removeFromCart}
            submitOrder={submitOrder} showToast={showToast}
          />
        )}
        {screen === "admin" && (
          <AdminScreen
            go={go} data={data} updateData={updateData}
            authed={adminAuthed} setAuthed={setAdminAuthed}
            pass={adminPass} setPass={setAdminPass} error={adminError} setError={setAdminError}
            showToast={showToast}
          />
        )}
      </div>

      {toast && <div className="toast">{toast}</div>}

      {moreSheet && (
        <div className="sheet-backdrop" onClick={() => setMoreSheet(false)}>
          <div className="sheet" onClick={(e) => e.stopPropagation()}>
            <div className="sheet-handle" />
            <div className="sheet-hero">
              <span className="sheet-hero-emoji">🧀 🥛 🏆 📍</span>

function avgRating(p) {
  const revs = p.reviews || [];

  return revs.reduce((s, r) => s + r.rating, 0) / revs.length;
}

  const displayImg = (variantObj && variantObj.img) ? variantObj.img : p.img;
  const displayImgId = variantObj ? `${p.id}-${variantObj.id}` : p.id;
  const hasPrice = Number(p.price) > 0;
  const finalPrice = effectivePrice(p);
  const reviews = p.reviews || [];
  const avg = avgRating(p);

  const submitReview = (e) => {
    e.preventDefault();
    if (!reviewForm.name.trim() || !reviewForm.comment.trim()) {
      showToast("الاسم والتعليق مطلوبان");
      return;
    }
    updateData(d => {
      const prod = d.products.find(x => x.id === p.id);
      if (!prod) return d;
      if (!prod.reviews) prod.reviews = [];
      prod.reviews.unshift({ id: "rev-" + Date.now(), name: reviewForm.name, rating: reviewForm.rating, comment: reviewForm.comment, date: new Date().toISOString() });
      return d;
    });
    setReviewForm({ name: "", rating: 5, comment: "" });
    showToast("شكرًا على تقييمك! ⭐");
  };

  return (
    <div className="screen" style={{ paddingBottom: hasPrice ? 82 : 0 }}>
      <TopBar title={p.name} onBack={() => go("products")} />
      <div className="pd-hero" style={{ background: BRAND_TINT[p.brand] }}>
        <SmartImage key={displayImgId} id={displayImgId} remoteSrc={displayImg} alt={p.name} className="pd-hero-img pd-hero-img-pop" boxClassName="pd-hero-fallback" iconSize={30} onClick={() => setLightbox(true)} />
        <div className="pd-hero-hint"><Search size={12}/> اضغط للتكبير</div>
        {hasVariants && <div className="pd-variants-ribbon">✨ {p.variants.length} أنواع متوفرة</div>}
      </div>
      {lightbox && (
        <div className="lightbox-backdrop" onClick={() => setLightbox(false)}>
          <button className="lightbox-close" onClick={() => setLightbox(false)} aria-label="إغلاق"><X size={20}/></button>
          <SmartImage key={displayImgId} id={displayImgId} remoteSrc={displayImg} alt={p.name} className="lightbox-img" boxClassName="lightbox-fallback" iconSize={36} />
        </div>
      )}
      <div className="content-pad">
        <div className="pd-head pd-anim" style={{ animationDelay: "0.05s" }}>
          <Pill color={color}>{p.brand}</Pill>
          <div style={{ display: "flex", gap: 6 }}>
            <button className="icon-btn" onClick={() => {
              const shareText = `${p.name} (${p.brand}) — ${p.desc}`;
              if (navigator.share) {
                navigator.share({ title: p.name, text: shareText }).catch(() => {});
              } else if (navigator.clipboard) {
                navigator.clipboard.writeText(shareText).then(() => showToast("تم نسخ معلومات المنتج 📋"));
              }
            }} aria-label="مشاركة">
              <ExternalLink size={18} color="#8a8478" />
            </button>
            <button className="icon-btn" onClick={() => toggleFav(p.id)}>
              <Heart size={20} fill={favs.includes(p.id) ? "#E0455A" : "none"} color={favs.includes(p.id) ? "#E0455A" : "#8a8478"} />
            </button>
          </div>
        </div>
        <h2 className="pd-title pd-anim" style={{ animationDelay: "0.1s" }}>{p.name}{variantObj ? ` — ${variantObj.label}` : ""}{sizeObj ? ` — ${sizeObj.label}` : ""}</h2>
        <div className="pd-type pd-anim" style={{ animationDelay: "0.15s" }}>{p.type}</div>

        {hasVariants && (
          <div className="variant-picker pd-anim" style={{ animationDelay: "0.2s" }}>
            <div className="variant-picker-title">🎨 اختر النوع</div>
            <div className="variant-chip-row">
              {p.variants.map(v => (
                <button
                  key={v.id}
                  className={"variant-chip" + (activeVariant === v.id ? " active" : "")}
                  style={activeVariant === v.id ? { borderColor: color, background: color, color: "#fff" } : {}}
                  onClick={() => selectVariant(v.id)}
                >
                  {v.label}
                </button>
              ))}
            </div>
            {hasSizeVariants && (
              <>
                <div className="variant-picker-title" style={{ marginTop: 12 }}>📏 اختر الحجم</div>
                <div className="variant-chip-row">
                  {variantObj.sizeVariants.map(s => (
                    <button
                      key={s.id}
                      className={"variant-chip" + (activeSize === s.id ? " active" : "")}
                      style={activeSize === s.id ? { borderColor: color, background: color, color: "#fff" } : {}}
                      onClick={() => setActiveSize(s.id)}
                    >
                      {s.label}
                    </button>
                  ))}
                </div>
              </>
            )}
          </div>
        )}

        {reviews.length > 0 ? (
          <div className="pd-rating-row pd-anim" style={{ animationDelay: "0.25s" }}>
            <StarRow rating={avg} />
            <span className="pd-rating-num">{avg.toFixed(1)}</span>

          <div className="pd-rating-row muted pd-anim" style={{ animationDelay: "0.25s" }}><StarRow rating={0} /> <span className="pd-rating-count">لا توجد تقييمات بعد — كن أول من يقيّم</span></div>
        )}
        <p className="pd-desc pd-anim" style={{ animationDelay: "0.3s" }}>{p.desc}</p>

        {hasPrice ? (
          <div className="pd-buy-box pd-anim" style={{ animationDelay: "0.35s" }}>
            <div className="pd-price-row">
              {Number(p.discount) > 0 ? (
                <>
                  <span className="price-old lg">{formatPrice(p.price)}</span>
                  <span className="price-now lg">{formatPrice(finalPrice)}</span>
                  <span className="price-badge">خصم {p.discount}%</span>
                </>
              ) : (
                <span className="price-now lg">{formatPrice(p.price)}</span>
              )}

            <div className="pd-qty-row">
              <span className="pd-qty-label">الكمية</span>
              <div className="qty-stepper">

                <span>{qty}</span>
                <button onClick={() => setQty(q => q + 1)} aria-label="زيادة"><Plus size={14}/></button>
              </div>
            </div>
          </div>
        ) : (
          <div className="pd-buy-box muted">
            <Info size={16}/> السعر غير محدد بعد لهذا المنتج — سيظهر هنا فور تحديده من لوحة التحكم.
          </div>
        )}

        <div className="pd-facts pd-anim" style={{ animationDelay: "0.4s" }}>
          <FactRow icon={Info} label="المكونات" value={p.ingredients} />
          <FactRow icon={Scale} label="الأوزان / الأحجام" value={p.sizes} />
          <FactRow icon={ShieldCheck} label="طريقة الحفظ" value={p.storage} />
          <FactRow icon={Clock} label="تاريخ الصلاحية" value={p.expiry} />
        </div>
        <SourceNote text="المصدر: صفحة المنتج على الموقع الرسمي لمجموعة GOUMIDI." />

        <div className="reviews-section pd-anim" style={{ animationDelay: "0.45s" }}>

                  <span className="review-name">🙂 {r.name}</span>

        </div>

        <button className="btn-outline full" style={{ borderColor: color, color, marginTop: 12 }} onClick={() => go("products")}>العودة إلى المنتجات</button>
      </div>

      {hasPrice && (
        <div className="sticky-buy-bar">
          <div className="sticky-buy-info">
            <span className="sticky-buy-price">{formatPrice(finalPrice * qty)}</span>
            <span className="sticky-buy-qty">× {qty}</span>

            <ShoppingCart size={16}/> أضف إلى السلة
          </button>
        </div>
      )}
    </div>
  );
}

const ORDER_STAGES = [
  { key: "جديد", label: "تم الاستلام", emoji: "📥" },
  { key: "قيد المعالجة", label: "قيد المعالجة", emoji: "⚙️" },
  { key: "تم الشحن", label: "تم الشحن", emoji: "🚚" },
  { key: "تم التسليم", label: "تم التسليم", emoji: "✅" },
];
function OrderStepper({ status }) {
  if (status === "ملغى") {
    return <div className="order-cancelled">🚫 هذا الطلب مُلغى</div>;
  }
  const idx = Math.max(0, ORDER_STAGES.findIndex(s => s.key === status));
  return (
    <div className="order-stepper">
      {ORDER_STAGES.map((s, i) => (
        <div key={s.key} className={"order-step" + (i <= idx ? " done" : "")}>
          <div className="order-step-dot">{i <= idx ? "✓" : s.emoji}</div>
          <div className="order-step-label">{s.label}</div>
          {i < ORDER_STAGES.length - 1 && <div className={"order-step-line" + (i < idx ? " done" : "")} />}
        </div>
      ))}
    </div>
  );
}

function CartScreen({ cart, products, go, setCartQty, removeFromCart, submitOrder, showToast }) {
  const [confirmedOrder, setConfirmedOrder] = useState(null);
  const [form, setForm] = useState({ name: "", phone: "", address: "", note: "" });
  const [formError, setFormError] = useState("");

  const items = cart.map(c => {
    const p = products.find(x => x.id === c.id);
    if (!p) return null;
    return { ...c, product: p, unitPrice: effectivePrice(p) };
  }).filter(Boolean);
  const total = items.reduce((s, it) => s + it.unitPrice * it.qty, 0);

  const handleSubmit = async (e) => {
    e.preventDefault();
    if (!form.name.trim() || !form.phone.trim()) {
      setFormError("الاسم ورقم الهاتف مطلوبان لإتمام الطلب.");
      return;
    }
    setFormError("");
    const order = await submitOrder(form);
    setConfirmedOrder(order);
  };

  if (confirmedOrder) {
    return (
      <div className="screen">
        <TopBar title="تم استلام الطلب" onBack={() => go("home")} />
        <div className="content-pad">
          <div className="card soft center">
            <Check size={30} color="#2E8B57" />
            <h3 style={{ margin: "10px 0 4px" }}>شكرًا لك، {confirmedOrder.customer.name}!</h3>
            <p className="hint no-margin">تم استلام طلبك رقم <b>{confirmedOrder.id}</b> بإجمالي {formatPrice(confirmedOrder.total)}. سنتواصل معك على {confirmedOrder.customer.phone} قريبًا لتأكيد التوصيل.</p>
          </div>
          <div className="card soft" style={{ marginTop: 12 }}>
            <div className="award-cat-title"><span className="award-emoji">🚚</span> حالة الطلب</div>
            <OrderStepper status={confirmedOrder.status} />
          </div>
          <button className="btn-primary full" onClick={() => go("home")}>العودة إلى الرئيسية</button>
        </div>
      </div>
    );
  }

  if (items.length === 0) {
    return (
      <div className="screen">
        <TopBar title="السلة" onBack={() => go("home")} />
        <div className="content-pad">
          <EmptyState text="سلتك فارغة. أضف منتجًا من صفحة المنتجات لتبدأ طلبك." />
          <button className="btn-primary full" onClick={() => go("products")}>تصفّح المنتجات</button>
        </div>
      </div>
    );
  }

  return (
    <div className="screen">
      <TopBar title="السلة" onBack={() => go("products")} />
      <div className="content-pad">
        <div className="cart-list">
          {items.map(it => (
            <div key={it.id} className="cart-row">
              <SmartImage id={it.product.id} remoteSrc={it.product.img} alt={it.product.name} className="cart-img" boxClassName="cart-img-box" iconSize={16} />
              <div className="cart-row-body">
                <div className="cart-row-name">{it.product.name}</div>
                <div className="cart-row-unit">{formatPrice(it.unitPrice)} / وحدة</div>
                <div className="qty-stepper small">

                  <button onClick={() => setCartQty(it.id, it.qty + 1)} aria-label="زيادة"><Plus size={12}/></button>

              </div>
              <div className="cart-row-right">
                <div className="cart-row-total">{formatPrice(it.unitPrice * it.qty)}</div>
                <button className="icon-btn danger" onClick={() => removeFromCart(it.id)} aria-label="حذف"><Trash2 size={15}/></button>
              </div>
            </div>
          ))}
        </div>

        <div className="cart-total-row">
          <span>الإجمالي</span>
          <span className="cart-total-value">{formatPrice(total)}</span>
        </div>

        <div className="card soft" style={{ marginTop: 16 }}>
          <div className="award-cat-title"><ShoppingCart size={16}/> بيانات التوصيل</div>
          <form onSubmit={handleSubmit}>
            <input className="admin-input" placeholder="الاسم الكامل" value={form.name} onChange={(e) => setForm({ ...form, name: e.target.value })} />
            <input className="admin-input" placeholder="رقم الهاتف" value={form.phone} onChange={(e) => setForm({ ...form, phone: e.target.value })} />
            <input className="admin-input" placeholder="العنوان (الولاية، البلدية...)" value={form.address} onChange={(e) => setForm({ ...form, address: e.target.value })} />
            <textarea className="admin-input" rows={2} placeholder="ملاحظة (اختياري)" value={form.note} onChange={(e) => setForm({ ...form, note: e.target.value })} />
            {formError && <div className="error-text">{formError}</div>}
            <button className="btn-primary full" type="submit">تأكيد الطلب — {formatPrice(total)}</button>
          </form>
        </div>
      </div>
    </div>
  );
}

/* ============================== Admin ============================== */
function AdminScreen({ go, data, updateData, authed, setAuthed, pass, setPass, error, setError, showToast }) {
  const [tab, setTab] = useState("company");
  const [newProduct, setNewProduct] = useState(null);
  const [editingId, setEditingId] = useState(null);
  const [newNews, setNewNews] = useState({ title: "", date: "", place: "", desc: "", link: "" });

  const login = (e) => {
    if (e && e.preventDefault) e.preventDefault();
    if (pass.trim().toLowerCase() === "okids2026") { setAuthed(true); setError(""); }
    else setError("كلمة المرور غير صحيحة. تأكد من كتابتها بدون مسافات: okids2026");
  };

  if (!authed) {
    return (
      <div className="screen">
        <TopBar title="لوحة التحكم" onBack={() => go("home")} />
        <div className="content-pad">
          <div className="card soft center">
            <Lock size={26} color="#1C4E9C" />
            <h3 style={{ margin: "10px 0 4px" }}>دخول المدير</h3>
            <p className="hint no-margin">هذه لوحة تجريبية توضيحية لإدارة محتوى التطبيق (منتجات، أخبار، بيانات الشركة).</p>
            <div className="admin-login">
              <input
                type="password"
                placeholder="كلمة المرور"
                value={pass}
                onChange={(e) => setPass(e.target.value)}
                onKeyDown={(e) => { if (e.key === "Enter") login(e); }}
              />
              <button className="btn-primary full" type="button" onClick={login}>دخول</button>
            </div>
            {error && <div className="error-text">{error}</div>}
            <p className="hint tiny no-margin">كلمة المرور التجريبية: okids2026 — تنبيه: هذا نموذج أولي بلا نظام دخول أو تشفير حقيقي؛ الربط بقاعدة بيانات وحسابات مدير فعلية يتطلب خادمًا خلفيًا حقيقيًا.</p>
            <p className="hint tiny no-margin" style={{ opacity: 0.5, marginTop: 6 }}>إصدار التطبيق: {APP_BUILD_ID}</p>
          </div>
        </div>
      </div>
    );
  }

  const c = data.company;

  const saveCompanyField = (field, value) => updateData(d => { d.company[field] = value; return d; });

  const addProduct = () => {
    const p = newProduct;
    if (!p?.name || !p?.brand) return;
    updateData(d => { d.products.push({ ...p, price: Number(p.price) || 0, discount: Number(p.discount) || 0, id: p.name.toLowerCase().replace(/\s+/g, "-") + "-" + Date.now() }); return d; });
    setNewProduct(null);
    showToast("تمت إضافة المنتج");
  };
  const deleteProduct = (id) => updateData(d => { d.products = d.products.filter(p => p.id !== id); return d; });
  const saveEditProduct = (id, field, value) => updateData(d => { const p = d.products.find(x => x.id === id); if (p) p[field] = value; return d; });

  const addNews = () => {
    if (!newNews.title || !newNews.date) return;
    updateData(d => { d.news.unshift({ ...newNews, id: "news-" + Date.now(), img: LOGO }); return d; });
    setNewNews({ title: "", date: "", place: "", desc: "", link: "" });
    showToast("تمت إضافة الخبر");
  };
  const deleteNews = (id) => updateData(d => { d.news = d.news.filter(n => n.id !== id); return d; });

  return (
    <div className="screen">
      <TopBar title="لوحة التحكم" onBack={() => go("home")} right={
        <button className="icon-btn" onClick={() => setAuthed(false)} aria-label="خروج"><LogOut size={18}/></button>
      } />
      <div className="content-pad">
        <div className="chip-row">
          {[["company","بيانات الشركة"],["products","المنتجات"],["orders","الطلبات" + (data.orders && data.orders.length ? ` (${data.orders.length})` : "")],["news","الأخبار"]].map(([id,label]) => (
            <button key={id} className={"chip" + (tab === id ? " active" : "")} onClick={() => setTab(id)}>{label}</button>
          ))}
        </div>

        {tab === "company" && (
          <div className="card soft">
            <AdminField label="عدد الموظفين (نطاق)" value={c.employeesRange} onSave={(v) => saveCompanyField("employeesRange", v)} />
            <AdminField label="العنوان" value={c.address} onSave={(v) => saveCompanyField("address", v)} />
            <AdminField label="الهاتف" value={c.phone} onSave={(v) => saveCompanyField("phone", v)} />

          </div>

        {tab === "products" && (

            {newProduct && (
              <div className="card soft" style={{ marginTop: 10 }}>
                {["name","brand","type","desc","img","ingredients","sizes","storage","expiry"].map(f => (

                <label className="admin-upload-btn">
                  📤 أو ارفع صورة من الجهاز

                    accept="image/*"
                    style={{ display: "none" }}
                    onChange={(e) => {
                      const file = e.target.files && e.target.files[0];

                  />

                {!newProduct.img && <p className="hint tiny no-margin"><ImageIcon size={12}/> لا توجد صورة رسمية؟ اترك الحقل فارغًا وسيظهر مكان مخصص للصورة بدل صورة مزيفة.</p>}
                <button className="btn-primary full" onClick={addProduct}>حفظ المنتج</button>

            <div className="admin-list">

                                <input

                                    if (!file) return;
                                    readImageAsDataURL(file, (dataUrl) => {

                      <div className="admin-field-row">
                        <div className="admin-field"><label>❄️ طريقة الحفظ</label><input className="admin-input" value={p.storage} onChange={(e) => saveEditProduct(p.id, "storage", e.target.value)} /></div>
                        <div className="admin-field"><label>⏳ الصلاحية</label><input className="admin-input" value={p.expiry} onChange={(e) => saveEditProduct(p.id, "expiry", e.target.value)} /></div>

                  <div className="admin-price-row">

        {tab === "orders" && (
          <div className="admin-list">
            {(!data.orders || data.orders.length === 0) && (
              <EmptyState text="لا توجد طلبات بعد. عندما يؤكد أحد الزوار طلبًا من السلة سيظهر هنا." />

              <div key={o.id} className="card soft order-card">

                <div className="order-items">
                  {o.items.map((it, i) => (

                      <span>{it.name} × {it.qty}</span>
                      <span>{formatPrice(it.unitPrice * it.qty)}</span>

                </div>
                <div className="order-total-row">
                  <span>الإجمالي</span>
                  <span>{formatPrice(o.total)}</span>

                <button className="icon-btn danger" style={{ marginTop: 8 }} onClick={() => updateData(d => { d.orders = d.orders.filter(x => x.id !== o.id); return d; })}>
                  <Trash2 size={14}/> حذف الطلب
                </button>
              </div>
            ))}

        {tab === "news" && (
          <>
            <div className="card soft">

function AdminField({ label, value, onSave, textarea }) {
  const [v, setV] = useState(value);
  useEffect(() => setV(value), [value]);
  return (
    <div className="admin-field">
      <label>{label}</label>
      {textarea ? (
        <textarea className="admin-input" rows={4} value={v} onChange={(e) => setV(e.target.value)} onBlur={() => onSave(v)} />
      ) : (
        <input className="admin-input" value={v} onChange={(e) => setV(e.target.value)} onBlur={() => onSave(v)} />
      )}
    </div>
  );
}

        <div className="info-row-label">{label}</div>
        <div className="info-row-value">{value}</div>
      </div>
    </div>
  );
}
function FactRow({ icon: Icon, label, value }) {
  return (
    <div className="fact-row">
      <Icon size={16} color="#1C4E9C" />
      <div>
        <div className="fact-label">{label}</div>
        <div className="fact-value">{value}</div>
      </div>
    </div>
  );
}
function SourceNote({ text }) {
  return <div className="source-note"><BookMarked size={13}/> {text}</div>;
}
function EmptyState({ text }) {

}

      .hot-badge{ position:absolute; top:10px; left:42px; background:#F5A524; color:#fff; font-size:8.5px; font-weight:800; padding:3px 7px; border-radius:6px; z-index:2; animation: pulseRing 1.6s ease-in-out infinite; }
      .variants-ribbon{ position:absolute; bottom:10px; right:10px; background:linear-gradient(120deg,var(--gold),#a9761f); color:#fff; font-size:8.5px; font-weight:800; padding:4px 9px; border-radius:20px; z-index:2; box-shadow:0 3px 8px rgba(200,155,60,0.4); animation: floatY 2.6s ease-in-out infinite; }
      .mini-variant-row{ display:flex; flex-wrap:wrap; gap:4px; margin-top:6px; }
      .mini-variant-dot{ font-size:9px; background:var(--cream); border:1px solid var(--line); border-radius:8px; padding:2px 7px; color:var(--muted); font-weight:700; }
      .product-type-emoji{ position:absolute; top:6px; left:6px; font-size:15px; opacity:0.85; z-index:1; }
      .fav-btn{ position:absolute; top:8px; left:8px; background:#fff; border:1px solid var(--line); width:28px; height:28px; border-radius:50%; display:flex; align-items:center; justify-content:center; z-index:2; }
      .product-img-wrap{ background:var(--cream); border-radius:12px; height:110px; display:flex; align-items:center; justify-content:center; overflow:hidden; margin-top:6px; cursor:pointer; position:relative; }
      .prod-img{ max-width:97%; max-height:97%; width:auto; height:auto; object-fit:contain; animation: gentleFloat 4.5s ease-in-out infinite; }
      @keyframes gentleFloat{ 0%,100%{ transform:translateY(0);} 50%{ transform:translateY(-5px);} }

      .marquee-wrap{ overflow:hidden; margin:12px 0 4px; -webkit-mask-image: linear-gradient(90deg, transparent, #000 8%, #000 92%, transparent); mask-image: linear-gradient(90deg, transparent, #000 8%, #000 92%, transparent); }
      .marquee-track{ display:flex; gap:10px; width:max-content; animation: marqueeScroll 22s linear infinite; padding:2px 4px; }
      .marquee-item{ flex-shrink:0; width:52px; height:52px; border-radius:14px; background:var(--paper); border:2px solid var(--line); padding:5px; box-shadow:0 3px 8px rgba(36,28,21,0.06); }
      .marquee-img, .marquee-img-box{ width:100%; height:100%; object-fit:contain; }
      @keyframes marqueeScroll{ from{ transform:translateX(0);} to{ transform:translateX(50%);} }
      .prod-img-box{ background:transparent; }
      .prod-img-box span{ font-size:10px; }
      .product-body{ padding:10px 2px 0; }
      .product-type{ font-size:10.5px; color:var(--muted); }
      .product-name{ font-family:'El Messiri',serif; font-weight:700; font-size:14.5px; margin:3px 0; line-height:1.3; }
      .product-desc{ font-size:11px; color:var(--muted); line-height:1.5; min-height:32px; }
      .product-price-row{ display:flex; align-items:center; gap:6px; margin-top:6px; flex-wrap:wrap; }
      .price-old{ font-size:11px; color:var(--muted); text-decoration:line-through; }
      .price-now{ font-size:13px; font-weight:800; color:var(--primary); }
      .price-badge{ background:var(--primary); color:#fff; font-size:9.5px; font-weight:700; padding:2px 6px; border-radius:8px; animation: pulseRing 1.8s ease-in-out infinite; }
      .price-old.lg{ font-size:14px; }
      .price-now.lg{ font-size:19px; }

      .empty-state{ text-align:center; padding:40px 20px; color:var(--muted); }
      .empty-state p{ font-size:13px; margin-top:8px; }

      /* Product detail */
      .pd-hero{ height:220px; display:flex; align-items:center; justify-content:center; position:relative; overflow:hidden; }
      .pd-hero-img-pop{ animation: heroPopIn 0.5s cubic-bezier(.22,1,.36,1) both; }
      @keyframes heroPopIn{ from{ opacity:0; transform:scale(0.75) rotate(-6deg);} to{ opacity:1; transform:scale(1) rotate(0);} }
      .pd-anim{ animation: fadeInUp 0.45s ease both; }
      .pd-hero-img{ max-height:92%; max-width:82%; width:auto; height:auto; object-fit:contain; cursor:zoom-in; }
      .pd-hero-fallback{ width:70%; height:82%; cursor:default; }
      .pd-hero-hint{ position:absolute; bottom:10px; left:50%; transform:translateX(-50%); background:rgba(36,28,21,0.55); color:#fff; font-size:10.5px; padding:4px 10px; border-radius:20px; display:flex; align-items:center; gap:4px; pointer-events:none; }
      .pd-variants-ribbon{ position:absolute; top:12px; left:12px; background:linear-gradient(120deg,var(--gold),#a9761f); color:#fff; font-size:10.5px; font-weight:800; padding:5px 12px; border-radius:20px; box-shadow:0 4px 12px rgba(200,155,60,0.4); animation: popIn 0.4s ease both, floatY 3s ease-in-out infinite 0.4s; }
      .variant-picker{ margin:10px 0 4px; }
      .variant-picker-title{ font-size:12px; font-weight:700; color:var(--ink); margin-bottom:8px; }
      .variant-chip-row{ display:flex; gap:8px; flex-wrap:wrap; }
      .variant-chip{ background:var(--paper); border:1.5px solid var(--line); padding:8px 16px; border-radius:14px; font-size:12.5px; font-weight:700; transition: all .2s ease; box-shadow:0 2px 6px rgba(36,28,21,0.05); }
      .variant-chip.active{ box-shadow:0 4px 14px rgba(0,0,0,0.18); transform:scale(1.05); }
      .lightbox-backdrop{ position:fixed; inset:0; background:rgba(15,11,7,0.92); z-index:80; display:flex; align-items:center; justify-content:center; padding:30px 20px; }
      .lightbox-img{ max-width:100%; max-height:80vh; object-fit:contain; }
      .lightbox-fallback{ width:260px; height:260px; border-radius:16px; }
      .lightbox-close{ position:absolute; top:20px; left:20px; background:rgba(255,255,255,0.12); border:1px solid rgba(255,255,255,0.3); color:#fff; width:38px; height:38px; border-radius:50%; display:flex; align-items:center; justify-content:center; }
      .pd-head{ display:flex; justify-content:space-between; align-items:center; margin:14px 0 6px; }
      .pill{ font-size:11px; font-weight:700; padding:4px 12px; border-radius:20px; }
      .pd-title{ font-size:21px; margin-top:8px; }
      .pd-type{ color:var(--muted); font-size:13px; margin:2px 0 10px; }
      .pd-desc{ font-size:13.5px; line-height:1.8; }
      .pd-facts{ display:flex; flex-direction:column; gap:10px; margin-top:14px; }

      /* Rating stars */
      .star-row{ display:flex; gap:2px; }
      .star{ color:#F5A524; line-height:1; }
      .star.interactive{ cursor:pointer; transition:transform .15s ease; }
      .star.interactive:active{ transform:scale(1.3); }
      .pd-rating-row{ display:flex; align-items:center; gap:6px; margin:6px 0 10px; }
      .pd-rating-row.muted{ opacity:0.7; }
      .pd-rating-num{ font-weight:800; font-size:13px; }
      .pd-rating-count{ font-size:11px; color:var(--muted); }

      /* Reviews */
      .reviews-section{ margin-top:20px; }
      .reviews-list{ display:flex; flex-direction:column; gap:10px; margin:10px 0 16px; }
      .review-card{ background:var(--paper); border:1px solid var(--line); border-radius:14px; padding:12px; animation: fadeInUp 0.35s ease both; }
      .review-head{ display:flex; justify-content:space-between; align-items:center; margin-bottom:4px; }
      .review-name{ font-weight:700; font-size:12.5px; }
      .review-comment{ font-size:12.5px; color:var(--ink); line-height:1.7; margin:0; }
      .review-form{ background:var(--paper); border:1px dashed var(--line); border-radius:16px; padding:14px; }
      .review-form-title{ font-weight:700; font-size:13px; margin-bottom:8px; }
      .review-form .star-row{ margin-bottom:10px; }

      /* Sticky buy bar */
      .sticky-buy-bar{ position:fixed; bottom:78px; left:50%; transform:translateX(-50%); width:100%; max-width:480px; background:var(--paper); border-top:1px solid var(--line); box-shadow:0 -6px 18px rgba(36,28,21,0.08); padding:10px 16px; display:flex; align-items:center; justify-content:space-between; gap:10px; z-index:25; animation: fadeInUp 0.3s ease; }
      .sticky-buy-info{ display:flex; flex-direction:column; }
      .sticky-buy-price{ font-weight:800; font-size:16px; color:var(--primary); }
      .sticky-buy-qty{ font-size:10.5px; color:var(--muted); }
      .sticky-buy-btn{ flex-shrink:0; }

      /* Order stepper */
      .order-stepper{ display:flex; align-items:flex-start; margin:12px 0; }
      .order-step{ flex:1; display:flex; flex-direction:column; align-items:center; position:relative; }
      .order-step-dot{ width:26px; height:26px; border-radius:50%; background:var(--cream); border:2px solid var(--line); display:flex; align-items:center; justify-content:center; font-size:11px; z-index:2; transition: background .3s ease, border-color .3s ease; }
      .order-step.done .order-step-dot{ background:var(--primary); border-color:var(--primary); color:#fff; }
      .order-step-label{ font-size:9.5px; color:var(--muted); margin-top:5px; text-align:center; }
      .order-step.done .order-step-label{ color:var(--ink); font-weight:700; }
      .order-step-line{ position:absolute; top:12px; right:50%; width:100%; height:2px; background:var(--line); z-index:1; }
      .order-step-line.done{ background:var(--primary); }
      .order-cancelled{ background:#FBEAEA; color:#b3261e; border-radius:10px; padding:10px; text-align:center; font-weight:700; font-size:12.5px; margin:10px 0; }
      .pd-buy-box{ background:var(--paper); border:1.5px solid var(--line); border-radius:16px; padding:14px; margin-top:14px; }
      .pd-buy-box.muted{ display:flex; align-items:center; gap:8px; color:var(--muted); font-size:12.5px; background:var(--cream); border-style:dashed; }
      .pd-price-row{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:12px; }
      .pd-qty-row{ display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; }
      .pd-qty-label{ font-size:12.5px; color:var(--muted); font-weight:700; }
      .qty-stepper{ display:flex; align-items:center; gap:10px; background:var(--cream); border:1px solid var(--line); border-radius:12px; padding:4px 8px; }
      .qty-stepper button{ width:26px; height:26px; border-radius:8px; background:var(--paper); border:1px solid var(--line); display:flex; align-items:center; justify-content:center; }
      .qty-stepper span{ min-width:18px; text-align:center; font-weight:700; font-size:13px; }
      .qty-stepper.small{ padding:2px 6px; gap:6px; margin-top:6px; }
      .qty-stepper.small button{ width:20px; height:20px; }
      .qty-stepper.small span{ font-size:11.5px; min-width:14px; }
      .fact-row{ display:flex; gap:10px; background:var(--paper); border:1px solid var(--line); padding:12px; border-radius:12px; }
      .fact-label{ font-size:11px; color:var(--muted); }
      .fact-value{ font-size:13px; font-weight:700; margin-top:2px; }

      /* Awards */
      .award-cat-title{ display:flex; align-items:center; gap:6px; font-weight:700; margin-bottom:8px; font-size:14px; }
      .award-emoji{ font-size:16px; }
      .award-card{ position:relative; overflow:hidden; }

      .mini-banner{ margin:0 18px 4px; padding:15px 16px; border-radius:18px; text-align:center; color:#fff;
        background: linear-gradient(120deg, #1C4E9C 0%, #123766 55%, #241C15 100%);
        background-size:200% 200%; animation: shimmerGrad 9s ease-in-out infinite;
        box-shadow:0 8px 20px rgba(28,78,156,0.22); }
      .mini-banner-emoji{ font-size:19px; letter-spacing:3px; display:block; margin-bottom:4px; animation: floatY 3.2s ease-in-out infinite; }
      .mini-banner-title{ font-family:'Lalezar',serif; font-size:18px; letter-spacing:0.3px; }
      .mini-banner-sub{ font-size:11px; opacity:0.85; margin-top:3px; }
      .bullet-list{ margin:0; padding-inline-start:18px; font-size:13px; color:var(--ink); line-height:2; }

      /* News cards */
      .news-card{ background:var(--paper); border:1px solid var(--line); border-radius:16px; overflow:hidden; margin-bottom:14px; }
      .news-card-img{ height:120px; background:var(--cream); display:flex; align-items:center; justify-content:center; overflow:hidden; }
      .news-img{ max-height:100%; max-width:100%; width:auto; height:auto; object-fit:contain; }
      .news-img-box span{ font-size:10px; }
      .news-card-body{ padding:14px; }
      .news-card-date{ display:flex; align-items:center; gap:5px; font-size:11px; color:var(--gold); font-weight:700; }
      .news-card-title{ font-family:'El Messiri',serif; font-size:16px; margin:4px 0; }
      .news-card-place{ display:flex; align-items:center; gap:4px; font-size:11.5px; color:var(--muted); margin-bottom:8px; }
      .news-card-body p{ font-size:13px; line-height:1.8; margin:0 0 10px; }

      /* Map */
      .map-embed{ border-radius:14px; overflow:hidden; height:190px; border:1px solid var(--line); margin-bottom:14px; }
      .map-embed iframe{ width:100%; height:100%; border:0; }
      .cta-row{ display:flex; gap:10px; margin-top:14px; }
      .cta-row a{ flex:1; text-align:center; }

      .big-stat{ font-family:'El Messiri',serif; font-size:22px; color:var(--primary); font-weight:700; margin:6px 0; }

      /* Recipes */
      .recipe-grid{ display:flex; flex-direction:column; gap:12px; }
      .recipe-card{ background:var(--paper); border:1px solid var(--line); border-radius:16px; overflow:hidden; display:flex; }
      .recipe-img{ width:100px; height:100px; object-fit:cover; flex-shrink:0; }
      .recipe-img-box{ width:100px; height:100px; flex-shrink:0; padding:4px; }
      .recipe-img-box span{ font-size:9px; }
      .recipe-body{ padding:10px 12px; flex:1; }
      .recipe-title{ font-weight:700; font-size:14px; font-family:'El Messiri',serif; }
      .recipe-meta{ display:flex; align-items:center; gap:5px; font-size:11px; color:var(--muted); margin:4px 0 6px; }

      .social-row{ display:flex; gap:10px; margin:14px 0; }
      .social-row a{ width:40px; height:40px; border-radius:12px; background:var(--paper); border:1px solid var(--line); display:flex; align-items:center; justify-content:center; }

      .source-row{ display:flex; align-items:center; gap:8px; padding:10px 0; border-bottom:1px solid var(--line); font-size:13px; }
      .source-row:last-child{ border-bottom:none; }

      /* Compare */
      .compare-table-wrap{ overflow-x:auto; margin-top:18px; }
      .compare-table{ width:100%; border-collapse:collapse; background:var(--paper); border-radius:12px; overflow:hidden; font-size:12px; }
      .compare-table th, .compare-table td{ border:1px solid var(--line); padding:8px; text-align:center; }
      .compare-table th img{ width:50px; height:50px; object-fit:contain; display:block; margin:0 auto 4px; }
      .compare-table td:first-child{ font-weight:700; background:var(--cream); text-align:start; }

      /* Admin */
      .admin-login{ display:flex; flex-direction:column; gap:10px; margin-top:14px; }
      .admin-login input{ border:1px solid var(--line); border-radius:10px; padding:11px 14px; font-size:13.5px; }
      .error-text{ color:#c0392b; font-size:12.5px; margin-top:8px; }
      .admin-input{ width:100%; border:1px solid var(--line); border-radius:10px; padding:10px 12px; font-size:13px; margin-bottom:8px; background:var(--cream); }
      .admin-upload-btn{ display:flex; align-items:center; justify-content:center; gap:6px; background:var(--paper); border:1.5px dashed var(--primary); color:var(--primary); border-radius:10px; padding:10px; font-size:12.5px; font-weight:700; margin-bottom:8px; cursor:pointer; }
      .admin-img-preview-row{ display:flex; align-items:center; gap:10px; margin-bottom:4px; }
      .admin-upload-btn.small{ padding:6px 10px; font-size:11px; margin-bottom:0; flex-shrink:0; }
      .admin-upload-btn:active{ background:var(--cream); }
      .admin-variant-upload-row{ display:flex; align-items:center; gap:8px; margin-bottom:8px; }
      .admin-variant-label{ font-size:12px; font-weight:700; flex:1; }
      .admin-field{ margin-bottom:12px; }
      .admin-edit-full{ background:var(--cream); border:1px dashed var(--line); border-radius:12px; padding:12px; margin:8px 0; animation: fadeInUp 0.3s ease; }
      .admin-edit-full .admin-field{ margin-bottom:10px; }
      .admin-field-row{ display:flex; gap:8px; }
      .admin-field-row .admin-field{ flex:1; min-width:0; }
      .admin-field label{ font-size:11.5px; color:var(--muted); display:block; margin-bottom:4px; }
      .admin-list{ display:flex; flex-direction:column; gap:8px; margin-top:14px; }
      .admin-row{ display:flex; align-items:center; gap:10px; background:var(--paper); border:1px solid var(--line); border-radius:12px; padding:8px; }
      .admin-row-product{ flex-direction:column; align-items:stretch; gap:8px; }
      .admin-row-top{ display:flex; align-items:center; gap:10px; }
      .admin-price-row{ display:flex; align-items:center; gap:8px; }
      .admin-price-row .admin-input{ margin-bottom:0; }
      .admin-price-field{ flex:1; }
      .admin-price-field label{ font-size:10px; color:var(--muted); display:block; margin-bottom:2px; }
      .admin-price-final{ font-size:12px; font-weight:800; color:var(--primary); white-space:nowrap; padding-top:14px; }
      .order-card{ margin-bottom:12px; }
      .order-head{ display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:8px; }
      .order-status-select{ border:1px solid var(--line); border-radius:8px; padding:4px 8px; font-size:11px; background:var(--cream); }
      .order-customer{ display:flex; flex-direction:column; gap:3px; font-size:12px; margin-bottom:8px; }
      .order-customer > div{ display:flex; align-items:center; gap:5px; }
      .order-items{ border-top:1px dashed var(--line); padding-top:8px; margin-bottom:8px; }
      .order-item-row{ display:flex; justify-content:space-between; font-size:12px; padding:2px 0; }
      .order-total-row{ display:flex; justify-content:space-between; font-weight:800; font-size:13.5px; border-top:1px solid var(--line); padding-top:8px; color:var(--primary); }
      .admin-thumb{ width:40px; height:40px; object-fit:contain; background:var(--cream); border-radius:8px; flex-shrink:0; }
      .admin-thumb-box{ width:40px; height:40px; border-radius:8px; flex-shrink:0; padding:2px; }
      .admin-thumb-upload-wrap{ position:relative; display:inline-block; cursor:pointer; flex-shrink:0; }
      .admin-thumb-upload-wrap.small .admin-thumb, .admin-thumb-upload-wrap.small .admin-thumb-box{ width:32px; height:32px; }
      .admin-thumb-empty{ width:40px; height:40px; border-radius:8px; background:var(--cream); border:1px dashed var(--line); display:flex; align-items:center; justify-content:center; color:var(--muted); }
      .admin-thumb-upload-badge{ position:absolute; bottom:-3px; left:-3px; width:16px; height:16px; border-radius:50%; background:var(--primary); color:#fff; display:flex; align-items:center; justify-content:center; box-shadow:0 1px 4px rgba(0,0,0,0.25); }
      .admin-thumb-upload-wrap:active{ opacity:0.7; }
      .admin-thumb-box span{ display:none; }
      .admin-row-body{ flex:1; min-width:0; }
      .admin-row-title{ font-weight:700; font-size:13px; }

      /* Sheet */
      .sheet-backdrop{ position:fixed; inset:0; background:rgba(36,28,21,0.5); z-index:40; display:flex; align-items:flex-end; justify-content:center; }
      .sheet{ background:var(--cream); width:100%; max-width:480px; border-radius:22px 22px 0 0; padding:10px 18px 24px; animation:slideUp .25s ease; max-height:82vh; overflow-y:auto; }
      @keyframes slideUp{ from{ transform:translateY(100%);} to{ transform:translateY(0);} }
      .sheet-handle{ width:40px; height:4px; background:var(--line); border-radius:4px; margin:6px auto 14px; }
      .sheet-hero{ text-align:center; background:linear-gradient(120deg,#1C4E9C,#123766 60%,#241C15); background-size:200% 200%; animation:shimmerGrad 9s ease-in-out infinite; border-radius:18px; padding:16px; margin-bottom:16px; color:#fff; }
      .sheet-hero-emoji{ font-size:18px; letter-spacing:2px; display:block; margin-bottom:4px; }
      .sheet-hero-title{ font-family:'Lalezar',serif; font-size:20px; letter-spacing:0.3px; }
      .sheet-hero-sub{ font-size:11px; opacity:0.85; margin-top:3px; }
      .sheet-group{ margin-bottom:18px; }
      .sheet-group-title{ display:flex; align-items:center; gap:6px; font-family:'El Messiri',serif; font-weight:700; font-size:14px; color:var(--ink); margin-bottom:10px; }
      .sheet-title{ font-family:'El Messiri',serif; font-size:17px; margin-bottom:14px; font-weight:700; }
      .sheet-item{ display:flex; flex-direction:column; align-items:center; gap:8px; background:var(--paper); border:1px solid var(--line); border-radius:18px; padding:16px 8px; font-size:12px; font-weight:700; color:var(--ink); box-shadow:0 2px 8px rgba(36,28,21,0.05); }
      .sheet-icon-badge{ width:42px; height:42px; border-radius:13px; background:linear-gradient(145deg,var(--cream),#fff); border:1px solid var(--line); display:flex; align-items:center; justify-content:center; color:var(--primary); position:relative; }
      .sheet-icon-emoji{ position:absolute; bottom:-4px; left:-4px; font-size:13px; background:#fff; border-radius:50%; width:18px; height:18px; display:flex; align-items:center; justify-content:center; box-shadow:0 1px 4px rgba(0,0,0,0.15); }
      .sheet-item:active .sheet-icon-badge{ background:var(--primary); color:#fff; }
      .sheet-item svg{ color:inherit; }
      .sheet-grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }

      /* Bottom nav */
      .bottom-nav{ position:fixed; bottom:0; left:50%; transform:translateX(-50%); width:100%; max-width:480px; background:var(--paper); border-top:1px solid var(--line); display:flex; z-index:30; padding:6px 4px calc(6px + env(safe-area-inset-bottom)); }
